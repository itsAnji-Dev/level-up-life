<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1f" />
  <title>LEVEL UP LIFE OPS — 3D Tactical Arena</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-192.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
</head>
<body>
  <div id="wp"></div>
  <div id="fog"><i></i><i></i></div>
  <div id="tod"></div>
  <canvas id="gl"></canvas>
  <div id="ui"></div>

  <script>
    /* ===== CORE LOBBY STATE, DATA, AUDIO & HELPERS ===== */
    const STORE_KEY = 'lul_ops_save_v6';
    const GLTF_CACHE = { soldier: null };

    const RAR = {
      C: { n: 'Common', c: 0x9aa0b5 },
      R: { n: 'Rare', c: 0x4aa8ff },
      E: { n: 'Epic', c: 0xb45cff },
      L: { n: 'Legendary', c: 0xffb020 },
      M: { n: 'Mythic', c: 0xff2a55 }
    };

    const ITEMS = [
      { id: 0, name: 'VECTOR SMG', cat: 'smg', r: 'R', icon: '🔫', price: 200 },
      { id: 1, name: 'M870 SHOTGUN', cat: 'shotgun', r: 'E', icon: '💥', price: 450 },
      { id: 2, name: 'M4A1 CARBINE', cat: 'ar', r: 'C', icon: '🔫', price: 100 },
      { id: 3, name: 'M4A1 TACTICAL', cat: 'ar', r: 'R', icon: '🔫', price: 300 },
      { id: 4, name: 'GHOST RECON ARMOR', cat: 'skin', r: 'E', icon: '🦺', price: 500 },
      { id: 5, name: 'L96A1 SNIPER', cat: 'sniper', r: 'L', icon: '🎯', price: 850 },
      { id: 6, name: 'RPG-7 LAUNCHER', cat: 'launcher', r: 'L', icon: '🚀', price: 950 },
      { id: 7, name: 'AK-47 GOLD DRAGON', cat: 'ar', r: 'M', icon: '🐉', price: 1500 }
    ];

    const MAPS = [
      { id: 'firing_range', name: 'FIRING RANGE', sky: 0x6ea8dc, desc: 'Military training compound with warehouses & cover.' },
      { id: 'nuketown', name: 'NUKETOWN DESERT', sky: 0xd99b52, desc: 'Sun-baked desert outpost with close-quarters lanes.' },
      { id: 'shipment', name: 'SHIPMENT DOCKS', sky: 0x475569, desc: 'Tight shipping container yard for fast gunfights.' }
    ];

    function defaultState() {
      return {
        name: 'ANJI',
        lvl: 12,
        xp: 420,
        coins: 1250,
        cp: 180,
        wins: 9,
        map: 'firing_range',
        eq: { gun: 3, skin: 4 },
        owned: [0, 1, 2, 3, 4, 5, 6, 7],
        cfg: { gfx: 'High', sens: 100, muted: false, hud: {}, gunsmith: {} }
      };
    }

    let S = (() => {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        return Object.assign(defaultState(), parsed, {
          eq: Object.assign({ gun: 3, skin: 4 }, parsed.eq || {}),
          cfg: Object.assign({ gfx: 'High', sens: 100, muted: false, hud: {}, gunsmith: {} }, parsed.cfg || {})
        });
      } catch (e) {
        return defaultState();
      }
    })();

    function save() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {}
    }

    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function isPortrait() {
      return window.innerHeight > window.innerWidth;
    }

    function normPt(clientX, clientY) {
      if (isPortrait()) {
        return { x: clientY, y: window.innerWidth - clientX };
      }
      return { x: clientX, y: clientY };
    }

    function toast(msg) {
      document.querySelectorAll('.toast').forEach(t => t.remove());
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2600);
    }

    function addXP(amt) {
      S.xp = (S.xp || 0) + amt;
      const need = (S.lvl || 1) * 100;
      while (S.xp >= need) {
        S.xp -= need;
        S.lvl = (S.lvl || 1) + 1;
      }
      save();
    }

    function activeMap() {
      return MAPS.find(m => m.id === S.map) || MAPS[0];
    }

    function defHud() {
      return {
        minimap: { x: 2, y: 18, s: 100, o: 95 },
        joy:     { x: 4, y: 68, s: 100, o: 95 },
        fire:    { x: 84, y: 64, s: 100, o: 95 },
        scope:   { x: 75, y: 50, s: 90, o: 90 },
        jump:    { x: 88, y: 46, s: 90, o: 90 },
        crouch:  { x: 88, y: 31, s: 90, o: 90 },
        reload:  { x: 76, y: 76, s: 90, o: 90 },
        grenade: { x: 67, y: 64, s: 88, o: 90 },
        wswitch: { x: 67, y: 40, s: 88, o: 90 },
        cam:     { x: 76, y: 24, s: 88, o: 90 },
        hp:      { x: 1, y: 1, s: 100, o: 95 },
        ammo:    { x: 16, y: 1, s: 100, o: 95 },
        sqhud:   { x: 1, y: 12, s: 100, o: 95 },
        pckeys:  { x: 1, y: 74, s: 100, o: 95 }
      };
    }

    const SFX = {
      muted: !!S.cfg.muted,
      tone(f1, f2, dur = 0.08, type = 'triangle', vol = 0.14) {
        if (this.muted) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try {
          if (!this._ac) this._ac = new AC();
          if (this._ac.state === 'suspended') this._ac.resume();
          const t = this._ac.currentTime;
          const o = this._ac.createOscillator();
          const g = this._ac.createGain();
          o.type = type;
          o.frequency.setValueAtTime(f1, t);
          o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
          g.gain.setValueAtTime(vol, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + dur);
          o.connect(g).connect(this._ac.destination);
          o.start(t);
          o.stop(t + dur + 0.01);
        } catch (e) {}
      },
      click() { this.tone(620, 320, 0.05); },
      back() { this.tone(360, 220, 0.07); },
      deploy() { this.tone(240, 740, 0.24, 'sawtooth', 0.16); },
      coin() { this.tone(880, 1320, 0.11, 'sine', 0.15); },
      equip() { this.tone(520, 820, 0.09); },
      lvlup() { this.tone(440, 1180, 0.3, 'triangle', 0.18); },
      shot() { this.tone(190, 45, 0.12, 'sawtooth', 0.2); },
      reload() { this.tone(540, 260, 0.09); },
      boom() { this.tone(110, 24, 0.42, 'sawtooth', 0.28); }
    };

    if (typeof window.VOICE === 'undefined') {
      window.VOICE = {
        micOn: false,
        spkOn: true,
        toggleMic() {
          this.micOn = !this.micOn;
          const b = document.getElementById('ar-mic');
          if (b) { b.textContent = this.micOn ? '🎙️' : '🔇'; b.className = 'abtn-top ' + (this.micOn ? 'on' : 'muted'); }
          toast(this.micOn ? '🎙️ Squad Mic ON' : '🔇 Squad Mic MUTED');
        },
        toggleSpk() {
          this.spkOn = !this.spkOn;
          const b = document.getElementById('ar-spk');
          if (b) { b.textContent = this.spkOn ? '🔊' : '🔈'; b.className = 'abtn-top ' + (this.spkOn ? 'on' : 'muted'); }
          toast(this.spkOn ? '🔊 Squad Audio ON' : '🔈 Squad Audio MUTED');
        }
      };
    }

    function squadMembers() {
      return [{ pid: 'me', name: S.name || 'ANJI', isHost: true, me: true, speaking: false }];
    }

    function confirmExitMatch() {
      if (!AR) return;
      AR.paused = 1;
      if (document.pointerLockElement) {
        try { document.exitPointerLock(); } catch (e) {}
      }
      const m = document.createElement('div');
      m.className = 'modal';
      m.innerHTML = `
        <div class="pop L">
          <h3 style="color:var(--y);margin-bottom:8px">EXIT 3D BATTLE ARENA?</h3>
          <p class="s" style="margin-bottom:14px">Extract now to claim your kill XP & Coins, or resume combat.</p>
          <div class="row" style="justify-content:center">
            <button class="sm alt" id="ex-resume">RESUME</button>
            <button class="sm" id="ex-claim">EXTRACT & CLAIM</button>
          </div>
        </div>
      `;
      document.body.appendChild(m);
      document.getElementById('ex-resume').onclick = () => {
        m.remove();
        if (AR) AR.paused = 0;
      };
      document.getElementById('ex-claim').onclick = () => {
        m.remove();
        exitMatch(true);
      };
    }

    /* ===== LOBBY UI RENDERER ===== */
    let activePage = null;

    function openSettingsModal() {
      const m = document.createElement('div');
      m.className = 'modal';
      m.innerHTML = `
        <div class="pop R" style="text-align:left">
          <div class="row" style="justify-content:space-between">
            <b style="color:var(--y);font-size:1rem">⚙️ SETTINGS & HUD</b>
            <button class="sm danger" id="st-close">✕</button>
          </div>
          <div style="margin:10px 0">
            <div class="s" style="margin-bottom:4px">Graphics Quality</div>
            <div class="pills" id="st-gfx">
              ${['Low', 'Medium', 'High'].map(g => `<button class="${S.cfg.gfx === g ? 'on' : ''}" data-g="${g}">${g}</button>`).join('')}
            </div>
          </div>
          <div style="margin:10px 0">
            <div class="s">Aim Sensitivity: <b id="st-sval" style="color:var(--y)">${S.cfg.sens}%</b></div>
            <input type="range" id="st-sens" min="30" max="200" value="${S.cfg.sens}" />
          </div>
          <div class="row" style="margin-top:12px">
            <button class="sm" id="st-hud">🎛️ CUSTOMIZE HUD</button>
            <button class="sm alt" id="st-mute">${SFX.muted ? '🔇 UNMUTE SFX' : '🔊 MUTE SFX'}</button>
          </div>
        </div>
      `;
      document.body.appendChild(m);

      document.getElementById('st-close').onclick = () => m.remove();
      m.querySelectorAll('#st-gfx button').forEach(b => {
        b.onclick = () => {
          S.cfg.gfx = b.dataset.g;
          save();
          m.querySelectorAll('#st-gfx button').forEach(x => x.classList.toggle('on', x === b));
          toast('Graphics: ' + S.cfg.gfx);
        };
      });
      const sensInp = document.getElementById('st-sens');
      sensInp.oninput = () => {
        S.cfg.sens = +sensInp.value;
        document.getElementById('st-sval').textContent = S.cfg.sens + '%';
        save();
      };
      document.getElementById('st-hud').onclick = () => {
        m.remove();
        if (typeof openHudEditor === 'function') openHudEditor();
      };
      document.getElementById('st-mute').onclick = e => {
        SFX.muted = !SFX.muted;
        S.cfg.muted = SFX.muted;
        save();
        e.target.textContent = SFX.muted ? '🔇 UNMUTE SFX' : '🔊 MUTE SFX';
      };
    }

    function render() {
      const ui = document.getElementById('ui');
      if (!ui) return;
      const curGun = ITEMS.find(x => x.id === S.eq.gun) || ITEMS[3];
      const map = activeMap();
      const xpPct = Math.min(100, Math.round(((S.xp || 0) / ((S.lvl || 1) * 100)) * 100));

      let pageHtml = '';
      if (activePage === 'loadout') {
        pageHtml = `
          <div class="pg">
            <div class="ph">
              <button class="bk" onclick="activePage=null;render()">←</button>
              <h1>🎒 ARSENAL & LOADOUT</h1>
              <span class="s">EQUIPPED: <b style="color:var(--y)">${esc(curGun.name)}</b></span>
            </div>
            <div class="pb">
              <div class="ct">
                <div class="grid">
                  ${ITEMS.filter(it => it.cat !== 'skin').map(it => {
                    const isEq = S.eq.gun === it.id;
                    return `<div class="it ${it.r}${isEq ? ' eq' : ''}">
                      <div class="i">${it.icon}</div>
                      <div class="r${it.r}">${esc(it.name)}</div>
                      <div class="s">${it.cat.toUpperCase()}</div>
                      <button class="sm ${isEq ? 'alt' : ''}" onclick="S.eq.gun=${it.id};save();SFX.equip();render()">${isEq ? 'EQUIPPED' : 'EQUIP'}</button>
                    </div>`;
                  }).join('')}
                </div>
              </div>
            </div>
          </div>`;
      } else if (activePage === 'maps') {
        pageHtml = `
          <div class="pg">
            <div class="ph">
              <button class="bk" onclick="activePage=null;render()">←</button>
              <h1>🗺️ SELECT BATTLE MAP</h1>
            </div>
            <div class="pb">
              <div class="ct">
                ${MAPS.map(mp => `
                  <div class="mcard${S.map === mp.id ? ' on' : ''}" onclick="S.map='${mp.id}';save();SFX.click();render()">
                    <div>
                      <b style="color:var(--y)">${esc(mp.name)}</b>
                      <div class="s">${esc(mp.desc)}</div>
                    </div>
                    <span class="sm ${S.map === mp.id ? '' : 'alt'}">${S.map === mp.id ? 'ACTIVE' : 'SELECT'}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>`;
      }

      ui.innerHTML = `
        <div class="top">
          <div class="me">
            <div class="av">🪖</div>
            <div>
              <b>${esc(S.name)}</b> <small>LV.${S.lvl}</small>
              <div class="bar"><i style="width:${xpPct}%"></i></div>
              <div class="tlcur">
                <b>🪙 ${S.coins}</b>
                <b class="cp">💎 ${S.cp} CP</b>
              </div>
            </div>
          </div>
          <div class="cur">
            <button class="cfg" onclick="if(typeof toggleArenaFullscreen==='function')toggleArenaFullscreen()" title="Fullscreen">⛶</button>
            <button class="cfg" onclick="openSettingsModal()">⚙️ SETTINGS</button>
          </div>
        </div>

        <div class="col L">
          <button class="ban" onclick="activePage='loadout';SFX.click();render()">
            🔫 GUNSMITH LOADOUT
            <small>${esc(curGun.name)}</small>
          </button>
          <button class="ban login" onclick="if(typeof openHudEditor==='function')openHudEditor()">
            🎛️ CUSTOM HUD
            <small>MOVE & RESIZE ALL BUTTONS</small>
          </button>
        </div>

        <div class="col Rr">
          <button class="mode" onclick="activePage='maps';SFX.click();render()">
            MULTIPLAYER 3D
            <small>MAP: ${esc(map.name)}</small>
          </button>
        </div>

        <div class="lob-tags">
          <div class="ltag host">
            <span class="rk-b">★ SQUAD LEADER</span>
            <b>${esc(S.name)}</b>
            <small>${esc(curGun.name)}</small>
          </div>
        </div>

        <div class="bot">
          <button class="nb" onclick="activePage='loadout';SFX.click();render()">🎒 LOADOUT</button>
          <button class="nb" onclick="if(typeof openHudEditor==='function')openHudEditor()">🎛️ HUD</button>
          <button class="nb mapb" onclick="activePage='maps';SFX.click();render()">
            MAP
            <small>${esc(map.name)}</small>
          </button>
          <div class="tick">⚡ READY FOR DEPLOYMENT · WHEEL: SCROLL GUNS · SNIPER: HOLD FIRE TO SCOPE, RELEASE TO SHOOT</div>
          <button class="nb big" onclick="startMatch()">START</button>
        </div>
        ${pageHtml}
      `;
    }

    /* ===== LOBBY 3D SOLDIER PREVIEW ===== */
    (function initLobbyPreview() {
      const gl = document.getElementById('gl');
      if (!gl || typeof THREE === 'undefined') return;
      try {
        const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
        const scene = new THREE.Scene();
        const cam = new THREE.PerspectiveCamera(45, 1, 0.1, 50);
        cam.position.set(0, 1.45, 3.6);
        cam.lookAt(0, 1.05, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.85));
        const dir = new THREE.DirectionalLight(0xfffbeb, 1.0);
        dir.position.set(3, 6, 4);
        scene.add(dir);

        const ped = new THREE.Mesh(
          new THREE.CylinderGeometry(1.05, 1.15, 0.14, 24),
          new THREE.MeshLambertMaterial({ color: 0x1e293b })
        );
        ped.position.y = -0.07;
        scene.add(ped);

        const ring = new THREE.Mesh(
          new THREE.RingGeometry(1.06, 1.14, 32),
          new THREE.MeshBasicMaterial({ color: 0xf5d300, side: THREE.DoubleSide })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = 0.01;
        scene.add(ring);

        let lobbyModel = null;
        if (THREE.GLTFLoader) {
          new THREE.GLTFLoader().load(
            'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/models/gltf/Soldier.glb',
            gltf => {
              GLTF_CACHE.soldier = gltf;
              lobbyModel = gltf.scene;
              lobbyModel.scale.setScalar(1.05);
              scene.add(lobbyModel);
            }
          );
        }

        function resizeLobby() {
          const w = Math.max(1, isPortrait() ? window.innerHeight : window.innerWidth);
          const h = Math.max(1, isPortrait() ? window.innerWidth : window.innerHeight);
          renderer.setSize(w, h, false);
          cam.aspect = w / h;
          cam.updateProjectionMatrix();
        }
        resizeLobby();
        window.addEventListener('resize', resizeLobby);

        function tick() {
          requestAnimationFrame(tick);
          if (typeof AR !== 'undefined' && AR) return;
          if (lobbyModel) lobbyModel.rotation.y += 0.006;
          renderer.render(scene, cam);
        }
        tick();
      } catch (e) {}
    })();

    render();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
  <script src="./mp-voice.js"></script>
  <script src="./arena3d.js"></script>
</body>
</html>
