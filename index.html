<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<link rel="icon" type="image/svg+xml" href="icon-192.svg">
<title>Level Up Life: Mission Hub</title>
<style>
:root{--y:#f5d300;--bg:#0a0e1f;--pn:#141c38;--pn2:#1f2a52;--tx:#eef2ff;--mu:#8e9ac4;--C:#9aa0b5;--R:#4aa8ff;--E:#b45cff;--L:#ffb020;--M:#ff2a55;--cut:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html{font-size:clamp(10px,3.4vh,16px);touch-action:manipulation;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 62% 18%,#3d5290 0,#1a2145 42%,#080b19 85%);color:var(--tx);font-family:Bahnschrift,"Arial Narrow",Impact,sans-serif;width:100vw;height:100vh;overflow:hidden;text-transform:uppercase;letter-spacing:.03em;touch-action:manipulation}
@media (orientation:portrait){
  body{width:100vh;height:100vw;transform:rotate(90deg) translateY(-100%);transform-origin:top left;position:fixed;top:0;left:0}
  html{font-size:clamp(9px,3.4vw,15px)}
}
#gl{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}#ui button,#ui input,#ui select,#ui textarea,#ui .pg,#ui .tick,#ui .team-hud{pointer-events:auto}
button{font:inherit;text-transform:inherit;letter-spacing:inherit;color:var(--tx);cursor:pointer;border:0;touch-action:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--y)}
.top{position:absolute;top:6px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start}
.me{display:flex;gap:8px;background:#000a;padding:5px 12px 5px 5px;clip-path:var(--cut);border-left:3px solid var(--y)}
.av{width:2.8rem;height:2.8rem;background:var(--pn2);display:grid;place-items:center;font-size:1.7rem;border:0;padding:3px}
.me small{color:var(--mu);font-size:.68rem}.bar{height:.36rem;background:#fff2;margin-top:3px;width:9.5rem}.bar i{display:block;height:100%;background:var(--y);transition:width .5s}
.tlcur{display:flex;gap:8px;margin-top:3px;font-size:.75rem;font-weight:700}
.tlcur b{background:#ffffff14;padding:1px 7px;border-radius:1rem;border:1px solid #fff2}.tlcur b.cp{border-color:#ff2a5588;color:#ff85a1}
.cur{display:flex;gap:5px;align-items:center}.cur span,.cur button.cfg{background:#000a;padding:4px 9px;border-radius:2rem;border:1px solid #f5d30055;font-size:.82rem}
.cur button.exitb{background:#7f1d1dcc;padding:4px 9px;border-radius:2rem;border:1px solid #ff2a55aa;font-size:.76rem;font-weight:700}
.col{position:absolute;display:flex;flex-direction:column;gap:5px;width:clamp(120px,21vw,205px)}
.L{left:8px;bottom:4.05rem}.Rr{right:8px;top:3.9rem}
.ban{position:relative;text-align:left;padding:.4rem .6rem;min-height:2.3rem;background:linear-gradient(100deg,#5b3fd1aa,#1f2a52cc);border:1px solid #fff3;clip-path:var(--cut);font-size:.8rem;font-weight:700}
.ban small{display:block;color:#ffe97a;font-size:.6rem;font-weight:400}
.ban.sale{background:linear-gradient(100deg,#c7861aaa,#5a3a0acc)}.ban.draw{background:linear-gradient(100deg,#8a2be2cc,#2a1050cc)}.ban.login{background:linear-gradient(100deg,#0f6b6ecc,#0c2b3acc)}
.tag{position:absolute;top:-5px;right:2px;background:#ff3b5c;font-size:.58rem;padding:1px 5px}
.claim{background:#000a;border:1px solid var(--y);padding:4px;text-align:center;clip-path:var(--cut);font-size:.72rem}.claim button{margin-top:2px;width:100%;background:repeating-linear-gradient(-45deg,var(--y),var(--y) 7px,#c9ab00 7px,#c9ab00 14px);color:#000;font-weight:700;padding:3px}
.mode{position:relative;height:2.65rem;text-align:left;padding:0 .7rem;font-weight:700;font-size:.82rem;background:linear-gradient(90deg,#0b1020,#2a3a70);border:1px solid #fff3;clip-path:var(--cut)}.mode small{display:block;font-size:.6rem;color:var(--y);font-weight:400}

/* TOP-LEFT SQUAD & VOICE HUD (HOME SCREEN + 3D WORLD) */
.team-hud{position:fixed;top:4.15rem;left:8px;width:clamp(155px,22vw,220px);background:#070d1ee0;border:1px solid #f5d30066;clip-path:var(--cut);padding:5px;z-index:25;pointer-events:auto}
.arena-team{top:46px;left:12px;width:clamp(160px,22vw,225px);z-index:84}
.th-hdr{display:flex;align-items:center;justify-content:space-between;gap:4px;background:linear-gradient(90deg,#1d2d5c,#101936);border-bottom:1px solid #f5d30055;padding:3px 5px;margin-bottom:4px;font-size:.66rem;font-weight:900;color:var(--y)}
.th-vbtns{display:flex;gap:3px}
.vbtn{width:1.55rem;height:1.45rem;border-radius:4px;background:#1e293b;border:1px solid #ffffff33;font-size:.72rem;display:grid;place-items:center;padding:0}
.vbtn.on{background:#15803d;border-color:#4ade80;color:#fff}
.vbtn.mute{background:#7f1d1d;border-color:#f87171;color:#fecaca}
.tm-row{display:flex;align-items:center;gap:5px;background:#ffffff10;padding:3px 5px;margin-bottom:3px;border-left:2px solid #5be58a;font-size:.65rem}
.tm-row.wait{border-left-color:#f59e0b}
.tm-row.empty{border-left-color:#ffffff33;cursor:pointer;padding:4px 5px}.tm-row.empty:hover{background:#ffffff22}
.tm-nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.tm-st{font-size:.55rem;padding:1px 4px;border-radius:3px;font-weight:700}
.tm-st.ok{background:#14532d;color:#4ade80}.tm-st.wt{background:#78350f;color:#fcd34d}.tm-st.ld{background:#713f12;color:#fde047}

/* CODM-Style Floating Character Nameplates */
.lob-tags{position:absolute;left:22%;right:22%;bottom:4.2rem;display:flex;justify-content:center;gap:clamp(6px,2vw,24px);pointer-events:none;flex-wrap:wrap}
.ltag{background:#070d1ed9;border:1px solid #ffb020aa;padding:3px 7px;text-align:center;clip-path:var(--cut);min-width:5.4rem}
.ltag .rk-b{font-size:.54rem;color:#ffb020;font-weight:700}
.ltag b{display:block;font-size:.7rem;color:#fff}
.ltag small{font-size:.56rem;font-weight:700}

.bot{position:absolute;bottom:6px;left:8px;right:8px;display:flex;gap:6px;align-items:flex-end}
.nb{position:relative;flex:1;max-width:132px;height:2.95rem;background:linear-gradient(#1b2547,#0c1228);border:1px solid #f5d30066;clip-path:var(--cut);font-weight:700;font-size:.74rem}
.nb.mapb{max-width:146px;background:linear-gradient(135deg,#132e4a,#0b162c);border:1px solid #4aa8ff99;text-align:left;padding:0 .6rem}
.nb.mapb small{display:block;color:#7cc4ff;font-size:.6rem;font-weight:400}
.nb.big{max-width:none;flex:0 0 clamp(128px,21vw,200px);background:linear-gradient(#f5d300,#c9ab00);color:#000;font-size:.98rem;font-weight:900}
.nb.big.wait{background:linear-gradient(#475569,#1e293b);color:#e2e8f0;border-color:#94a3b8}
.nb.big.ready-on{background:linear-gradient(#22c55e,#15803d);color:#fff;border-color:#86efac}
.tick{flex:1;height:2rem;background:#0007;padding:.4rem .7rem;font-size:.74rem;color:#cfd8ff;overflow:hidden;white-space:nowrap;border-bottom:2px solid var(--y)}
.pg{position:absolute;inset:0;background:#080d1cf5;display:flex;flex-direction:column;animation:in .2s;z-index:40}
@keyframes in{from{transform:translateX(24px);opacity:0}}
.ph{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid #f5d30044}.ph h1{font-size:1.15rem;flex:1}
.bk{background:none;color:var(--y);font-size:1.45rem}
.pb{flex:1;display:flex;gap:10px;padding:10px;min-height:0}
.tabs{width:clamp(100px,18vw,165px);display:flex;flex-direction:column;gap:5px;overflow-y:auto}.tabs button{padding:.65rem .6rem;text-align:left;background:#ffffff14;font-weight:700;font-size:.82rem;position:relative}.tabs button.on{background:#e8ecf6;color:#111}
.ct{flex:1;overflow-y:auto;min-width:0;padding-right:2px}
.pg.half{background:none;pointer-events:none}.pg.half>*{pointer-events:auto}.pg.half .ph{width:50%}.pg.half .pb{margin-left:50%;background:#080d1ce0}.pg.half .tabs{width:5.5rem}
.ev{background:linear-gradient(90deg,#14405f,#0f2b4a);padding:9px;margin-bottom:9px;display:flex;gap:10px;align-items:center}
.trk{flex:1;display:flex;align-items:center}.ms{flex:1;text-align:center;position:relative}.ms:before{content:"";position:absolute;top:2rem;left:-50%;right:50%;height:4px;background:#fff3}.ms.ok:before{background:var(--y)}.ms:first-child:before{display:none}
.ms .bx{width:2.4rem;height:2.4rem;margin:auto;display:grid;place-items:center;font-size:1.3rem;background:#5b3fd1;position:relative}.ms .dm{display:inline-block;margin-top:.25rem;width:1.4rem;height:1.4rem;line-height:1.4rem;background:#1c2748;transform:rotate(45deg);font-size:.62rem}.ms .dm b{display:block;transform:rotate(-45deg)}
.ms.ok .dm{background:var(--y);color:#000}
.task{display:flex;gap:8px;align-items:center;background:#ffffff10;padding:8px 10px;margin-bottom:7px;border-top:1px solid #fff2}
.task .ic{width:2.5rem;height:2.5rem;background:#2e4a7a;display:grid;place-items:center;font-size:1.25rem}.task .g{flex:1}.task .pr{height:.5rem;background:#ffffff22;margin-top:4px}.task .pr i{display:block;height:100%;background:var(--y)}
.go{background:#eef2ff;color:#111;font-weight:700;padding:.45rem .9rem}.go:disabled,.done{background:#1b3a2a;color:#5be58a}
.sm{background:var(--y);color:#000;font-weight:700;padding:.42rem .85rem;clip-path:var(--cut)}.sm.alt{background:#2a3568;color:#fff}.sm.cpb{background:linear-gradient(135deg,#ff2a55,#b81438);color:#fff}.sm.danger{background:#a61c2e;color:#fff}.sm:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.6rem,1fr));gap:8px}
.it{background:linear-gradient(180deg,#1a2448,#0f152e);padding:8px 5px;text-align:center;border-bottom:4px solid var(--C);border-top:1px solid #fff2;font-size:.66rem;position:relative;clip-path:var(--cut);transition:transform .15s}.it:active{transform:scale(.97)}
.it .i{height:2.8rem;display:grid;place-items:center;font-size:2rem}.it.lock .i{filter:brightness(0);opacity:.28}
.it.R{border-bottom-color:var(--R);background:linear-gradient(180deg,#172d4f,#0e162e)}.it.E{border-bottom-color:var(--E);background:linear-gradient(180deg,#2a194d,#10132b)}.it.L{border-bottom-color:var(--L);background:linear-gradient(180deg,#3d2b12,#121429);box-shadow:0 0 14px #ffb02044}
.it.M{border-bottom-color:var(--M);background:linear-gradient(180deg,#4a1024,#120d22);box-shadow:0 0 18px #ff2a5566;animation:mpulse 2.5s infinite alternate}
@keyframes mpulse{to{box-shadow:0 0 26px #ff2a55aa}}
.it.eq{outline:2px solid var(--y)}
.it button{margin-top:4px;font-size:.62rem;padding:3px 7px}
.rC{color:var(--C)}.rR{color:var(--R)}.rE{color:var(--E)}.rL{color:var(--L)}.rM{color:var(--M);font-weight:700}.s{color:var(--mu);font-size:.74rem}
.sh-hero{display:flex;gap:12px;align-items:center;background:linear-gradient(100deg,#251642,#112645);border:1px solid #f5d30044;padding:10px;margin-bottom:10px;clip-path:var(--cut)}
.sh-slots{display:flex;gap:8px;flex:1;justify-content:flex-end;flex-wrap:wrap}
.sh-slot{background:#0007;border:1px solid #fff2;padding:5px 8px;min-width:5.5rem;text-align:center;font-size:.65rem}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}.pills button{padding:4px 9px;background:#ffffff14;font-size:.7rem;border-radius:1rem}.pills button.on{background:var(--y);color:#000;font-weight:700}
.box{font-size:5rem;display:inline-block}.shake{animation:sh .45s infinite}@keyframes sh{25%{transform:rotate(-10deg) scale(1.08)}75%{transform:rotate(10deg) scale(1.08)}}
.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:95;pointer-events:auto;padding:12px}
.pop{background:#141c38;padding:1.3rem 1.8rem;text-align:center;border:3px solid var(--C);min-width:17rem;max-width:27rem;clip-path:var(--cut)}.pop.R{border-color:var(--R)}.pop.E{border-color:var(--E)}.pop.L{border-color:var(--L);box-shadow:0 0 45px #ffb020aa}.pop.M{border-color:var(--M);box-shadow:0 0 55px #ff2a55cc}.pop .big{width:5.5rem;height:5.5rem;margin:auto;font-size:4.5rem;animation:pp .5s}@keyframes pp{from{transform:scale(.2) rotate(-30deg);opacity:0}}
.sbar{display:flex;align-items:center;gap:8px;font-size:.7rem;margin:4px 0;text-align:left}.sbar span{width:4.8rem;color:var(--mu)}.sbar div{flex:1;height:.4rem;background:#fff2}.sbar i{display:block;height:100%;background:var(--y)}
.toast{position:fixed;left:50%;bottom:4.2rem;transform:translateX(-50%);background:#101a3a;border:2px solid var(--y);padding:.5rem 1rem;z-index:98;font-size:.84rem;text-align:center;max-width:82%}
input,select,textarea{font:inherit;background:#1f2a52;color:#fff;border:1px solid #fff2;padding:.5rem;width:100%;text-transform:none}.row{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.fr{display:flex;gap:10px;align-items:center;background:#ffffff10;padding:8px 10px;margin-bottom:6px;border-left:3px solid transparent}
.fr.M{border-left-color:var(--M)}.fr.L{border-left-color:var(--L)}.fr.E{border-left-color:var(--E)}.fr.R{border-left-color:var(--R)}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0}
.dcell{background:#ffffff12;padding:8px 4px;text-align:center;border-top:3px solid #fff3;font-size:.72rem}.dcell.ok{border-color:var(--y);background:#f5d30022}.dcell.got{opacity:.55}
.mapgrid{display:grid;grid-template-columns:1fr 1.2fr;gap:12px;height:100%}
.mcard{background:#ffffff10;padding:9px;margin-bottom:7px;border-left:3px solid #4aa8ff;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.mcard.on{background:#1d355e;outline:2px solid var(--y)}
#mcv{width:100%;height:165px;background:#070d1c;border:1px solid #4aa8ff66;display:block}
.fscr{position:fixed;inset:0;background:radial-gradient(circle at center,#16244a,#060914);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:auto;padding:16px}
.ftm{font-size:4.2rem;font-weight:900;color:var(--y);text-shadow:0 0 25px #f5d30088;letter-spacing:.08em;margin:8px 0}
input[type=range]{padding:0;accent-color:var(--y);height:1.4rem;background:transparent;border:0}

/* ===== PLAYABLE 3D BATTLE ARENA, SCOPE OVERLAY & CUSTOM HUD ===== */
#arena{position:fixed;inset:0;z-index:80;pointer-events:none}
#acv{position:fixed;inset:0;width:100%;height:100%;pointer-events:auto;touch-action:none}
.ahud{position:fixed;inset:0;pointer-events:none}
.ahud .hctrl{position:fixed;pointer-events:auto;touch-action:none;transform-origin:center center}
.atop{position:fixed;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.atop button{pointer-events:auto}
.ammo{background:#0b1328cc;border:2px solid #8ec5ff;padding:4px 14px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);font-size:1.15rem;font-weight:900;display:flex;align-items:center;gap:8px}
.hpbar{background:#000a;padding:4px 10px;border-left:3px solid #5be58a;font-size:.76rem}.hpbar div{width:8.5rem;height:.42rem;background:#fff2;margin-top:2px}.hpbar i{display:block;height:100%;background:#5be58a;transition:width .2s}
.aright{display:flex;gap:7px;align-items:center}
.abtn-top{width:2.6rem;height:2.6rem;border-radius:50%;background:#000b;border:2px solid #fff6;font-size:1.05rem;display:grid;place-items:center}
.xhair{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);width:22px;height:22px;border:2px solid #ff2a55cc;border-radius:50%;pointer-events:none;transition:all .15s}
.xhair:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;background:#f5d300;border-radius:50%;transform:translate(-50%,-50%)}
.scope-ov{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 21%,rgba(4,8,18,.88) 23%);display:none}
.scope-ov.on{display:block}
.scope-ov:before{content:"";position:absolute;left:50%;top:48%;width:44vh;height:44vh;transform:translate(-50%,-50%);border:2px solid #f5d300aa;border-radius:50%;box-shadow:inset 0 0 25px #000}
.scope-ov:after{content:"";position:absolute;left:50%;top:48%;width:42vh;height:1px;background:#ff2a5599;transform:translate(-50%,-50%)}
.joy{width:104px;height:104px;border-radius:50%;background:#0007;border:2px solid #ffffff55;position:relative}
.knob{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:radial-gradient(#eef2ff,#9aa8cc);box-shadow:0 0 12px #000a}
.act{width:3.4rem;height:3.4rem;border-radius:50%;background:#0a1124cc;border:2px solid #ffffff77;font-size:1.2rem;display:grid;place-items:center;box-shadow:0 4px 12px #0009}
.act:active,.act.scoped{transform:scale(.93);background:#f5d300;color:#000;border-color:#fff}
.act.fire{width:4.4rem;height:4.4rem;background:radial-gradient(#ff3b5c,#9e0b28);border-color:#ffd0d8;font-size:1.65rem}
.mfeed{position:fixed;top:48px;left:50%;transform:translateX(-50%);background:#0009;padding:3px 12px;border-radius:1rem;font-size:.72rem;color:var(--y);white-space:nowrap}
#radar{width:80px;height:80px;border-radius:50%;background:#060d1ecc;border:2px solid #4aa8ffaa;display:block}
.hud-ed{position:fixed;inset:0;background:#060b18ee;z-index:92;pointer-events:auto;touch-action:none}
.hud-item{position:fixed;border:2px dashed #ffffff88;background:#1f2a52cc;border-radius:50%;display:grid;place-items:center;font-size:.64rem;font-weight:700;text-align:center;touch-action:none;cursor:grab}
.hud-item.sel{border:2px solid var(--y);box-shadow:0 0 16px #f5d300aa;background:#3a2e08dd}
.hud-bar{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#101833f5;border:1px solid var(--y);padding:7px 12px;display:flex;gap:10px;align-items:center;z-index:93;clip-path:var(--cut);flex-wrap:wrap;max-width:94%}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
#fog{position:fixed;inset:0;pointer-events:none;overflow:hidden}#fog i{position:absolute;left:-30%;width:160%;height:45%;background:radial-gradient(ellipse,#a9bcff33,transparent 65%);animation:dr 30s linear infinite}#fog i:nth-child(1){top:4%}#fog i:nth-child(2){top:52%;animation-duration:44s;animation-direction:reverse}@keyframes dr{to{transform:translateX(20%)}}#fog:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,#000b)}
.scr{position:absolute;inset:0;background:radial-gradient(ellipse at 60% 20%,#3d5290,#080b19 80%) center/cover;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;pointer-events:auto}.scr:before{content:"";position:absolute;inset:0;background:linear-gradient(#0006,#000d)}.scr>*{position:relative}
.logo{font-size:2.5rem;font-weight:900;color:#fff;text-shadow:0 0 22px #f5d300aa;transform:skew(-8deg);text-align:center}.logo b{color:var(--y)}
.lbar{position:absolute;left:8%;right:8%;bottom:1rem}
.ico{width:100%;height:100%;object-fit:contain}.sic{width:2.6rem;height:2.6rem;display:grid;place-items:center;font-size:2rem}.ci{height:1.1em;width:1.1em;vertical-align:-.2em;margin-right:3px}
.rk{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,#2a1f5a,#14405f);padding:11px;margin-bottom:10px}.badge{width:3.6rem;height:4rem;flex:none;clip-path:polygon(50% 0,100% 15%,100% 70%,50% 100%,0 70%,0 15%);background:linear-gradient(#ffe56a,#a07800);display:grid;place-items:center;color:#000;font-weight:900;font-size:1.5rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}.stats div{background:#ffffff12;padding:7px;text-align:center;font-size:.72rem;color:var(--mu)}.stats b{display:block;font-size:1.15rem;color:var(--y)}
.track{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.lv{min-width:6.4rem;background:#ffffff12;padding:7px;text-align:center;border-top:3px solid #fff3;font-size:.72rem}.lv.ok{border-color:var(--y)}.lv .sm{margin-top:4px;padding:.28rem .55rem}

/* ===== REAL GAME AUDIO ENGINE ===== */
const SFX=(()=>{
  const G='https://actions.google.com/sounds/v1/';
  const LIB={
    click:[G+'weapons/rifle_fire_select.ogg'],
    back:[G+'tools/ejecting_a_cassette.ogg'],
    coin:[G+'weapons/shell_casings_revolver.ogg'],
    shot:[G+'weapons/gun_powder_ignite.ogg',G+'weapons/rifle_fire_select.ogg'],
    reload:[G+'weapons/gun_reload.ogg'],
    boom:[G+'weapons/explosion_large.ogg'],
    gunC:[G+'weapons/gun_parts_handling.ogg'],
    gunR:[G+'weapons/rifle_charging_handle.ogg'],
    gunE:[G+'weapons/shot_gun_handling.ogg'],
    gunL:[G+'weapons/cocking_a_50cal_gun.ogg'],
    gunM:[G+'science_fiction/sci_fi_vortex.ogg',G+'weapons/cocking_a_50cal_gun.ogg'],
    shake:[G+'science_fiction/suspense_builder.ogg'],
    lootC:[G+'weapons/gun_powder_ignite.ogg',G+'weapons/gun_parts_handling.ogg'],
    lootR:[G+'weapons/gun_reload.ogg',G+'weapons/rifle_charging_handle.ogg'],
    lootE:[G+'science_fiction/sci_fi_vortex.ogg',G+'weapons/shot_gun_handling.ogg'],
    cheer:[G+'crowd/applause.ogg']
  };
  const pool={};let ctx=null,amb=null;
  const cfg=()=>S&&S.cfg?S.cfg:{sfx:1,vol:85,bgm:0,vib:1};
  const volScale=()=>Math.max(0,Math.min(1,(cfg().vol??85)/100));
  function getCtx(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;if(!ctx)ctx=new A();if(ctx.state==='suspended')ctx.resume();return ctx}
  function vib(ms){try{if(cfg().vib&&navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
  function synth(f1,f2,dur,type='triangle',vol=.14,delay=0){
    const c=getCtx();if(!c)return;
    const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f1,t);
    if(f2&&f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    const v=vol*volScale();
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);
  }
  function brassFanfare(grand=0){
    if(!cfg().sfx||volScale()<=0)return;
    const c=getCtx();if(!c)return;
    const chords=grand?[[130.81,196,261.63,329.63],[146.83,220,293.66,369.99],[164.81,246.94,329.63,415.30],[196,293.66,392,493.88,587.33]]:[[130.81,196,261.63],[164.81,246.94,329.63],[196,293.66,392,493.88]];
    const step=grand?.22:.17;
    chords.forEach((notes,idx)=>{
      const dur=idx===chords.length-1?(grand?.95:.65):step*.95;
      const t0=c.currentTime+idx*step;
      notes.forEach(freq=>{
        const o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();
        o.type='sawtooth';o.frequency.setValueAtTime(freq,t0);
        f.type='lowpass';f.frequency.setValueAtTime(650,t0);f.frequency.exponentialRampToValueAtTime(1450,t0+dur*.6);
        const v=(grand?.085:.07)*volScale();
        g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(v,t0+.035);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
        o.connect(f);f.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+.03);
      });
    });
  }
  function clip(urls,vol=.8,maxMs=2800,fb=null){
    if(!cfg().sfx||volScale()<=0)return;
    const u=Array.isArray(urls)?urls[Math.floor(Math.random()*urls.length)]:urls;
    try{
      if(!pool[u]){pool[u]=new Audio(u);pool[u].preload='auto'}
      const a=pool[u].cloneNode();a.volume=Math.min(1,vol*volScale());
      const p=a.play();if(p&&p.catch)p.catch(()=>{if(fb)fb()});
      if(maxMs)setTimeout(()=>{try{a.pause();a.currentTime=0}catch(e){}},maxMs);
    }catch(e){if(fb)fb()}
  }
  function preload(){Object.values(LIB).flat().forEach(u=>{if(!pool[u]){pool[u]=new Audio(u);pool[u].preload='auto'}})}
  function click(){vib(12);clip(LIB.click,.55,400,()=>synth(540,260,.05,'triangle',.1))}
  function back(){vib(10);clip(LIB.back,.65,600,()=>synth(380,200,.06,'sine',.1))}
  function coin(){vib(20);clip(LIB.coin,.8,1100,()=>synth(660,990,.12,'triangle',.12))}
  function shot(){vib(15);clip(LIB.shot,.8,500,()=>synth(180,55,.09,'sawtooth',.16))}
  function reload(){vib([15,40,20]);clip(LIB.reload,.85,1500,()=>synth(260,420,.14,'triangle',.12))}
  function boom(){vib([60,30,90]);clip(LIB.boom,.95,2200,()=>synth(120,28,.45,'sawtooth',.22))}
  function equip(type,r){
    vib([20,30,30]);
    if(type==='gun')clip(LIB['gun'+(r||'C')]||LIB.gunC,.9,1800,()=>synth(220,440,.15,'sawtooth',.14));
    else clip(LIB.gunR,.75,1200,()=>synth(440,660,.12,'triangle',.12));
  }
  function quest(){vib([25,30,55]);brassFanfare(0);clip(LIB.cheer,.45,2200)}
  function lvlup(){vib([40,40,40,40,100]);brassFanfare(1);clip(LIB.cheer,.75,3200)}
  function shake(){vib([25,45,25,45,35,45,50]);clip(LIB.shake,.85,1150,()=>{for(let i=0;i<7;i++)synth(110+i*22,85,.08,'square',.08,i*.13)})}
  function loot(r){
    if(r==='M'||r==='L'){vib([60,40,60,40,150]);brassFanfare(1);clip(LIB.cheer,.7,3000)}
    else if(r==='E'){vib([45,35,90]);clip(LIB.lootE,.9,2400,()=>brassFanfare(0))}
    else if(r==='R'){vib([30,30,60]);clip(LIB.lootR,.85,1800,()=>brassFanfare(0))}
    else{vib(35);clip(LIB.lootC,.8,1500,()=>synth(280,420,.18,'triangle',.12))}
  }
  function deploy(){vib([30,40,60]);clip(LIB.gunL,.9,1600,()=>synth(220,440,.2,'sawtooth',.15))}
  function setAmb(on){
    if(!on){if(amb){try{amb.stop()}catch(e){}amb=null}return}
    const c=getCtx();if(!c||amb)return;
    const o1=c.createOscillator(),o2=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();
    o1.type='sawtooth';o1.frequency.value=55;o2.type='triangle';o2.frequency.value=82.41;
    f.type='lowpass';f.frequency.value=160;g.gain.value=.035;
    o1.connect(f);o2.connect(f);f.connect(g);g.connect(c.destination);
    o1.start();o2.start();amb={stop(){o1.stop();o2.stop()}};
  }
  return{preload,click,back,coin,shot,reload,boom,equip,quest,lvlup,shake,loot,deploy,setAmb,vib};
})();

/* ===== REAL-TIME SQUAD VOICE CHAT (WEBRTC + MIC & SPEAKER MUTE CONTROLS) ===== */
let MIC_ON=false,SPK_ON=true,MUTED_PEERS={};
const VOICE=(()=>{
  let stream=null,peers={},audios={};
  const RTC_CFG={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};

  async function ensureMic(){
    if(stream)return stream;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return null;
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
      stream.getAudioTracks().forEach(t=>t.enabled=MIC_ON);
      return stream;
    }catch(e){
      toast('Mic permission blocked by browser (visual mute synced)');
      return null;
    }
  }

  function getOrCreatePeer(remotePid,initiator=false){
    if(peers[remotePid])return peers[remotePid];
    const pc=new RTCPeerConnection(RTC_CFG);
    peers[remotePid]=pc;
    if(stream)stream.getTracks().forEach(tr=>pc.addTrack(tr,stream));

    pc.onicecandidate=e=>{
      if(e.candidate&&DB&&USER){
        OUTBOX.push({id:'ICE_'+Date.now()+'_'+Math.random(),type:'rtc_ice',fromPid:S.id,toPid:remotePid,payload:{cand:e.candidate.toJSON()},ts:Date.now()});
        pushMyPlayerDoc();
      }
    };
    pc.ontrack=e=>{
      let el=audios[remotePid];
      if(!el){el=document.createElement('audio');el.autoplay=true;el.playsInline=true;audios[remotePid]=el}
      el.srcObject=e.streams[0];
      el.muted=!SPK_ON||!!MUTED_PEERS[remotePid];
      el.play().catch(()=>{});
    };
    if(initiator){
      pc.createOffer().then(async off=>{
        await pc.setLocalDescription(off);
        OUTBOX=OUTBOX.filter(o=>!(o.type==='rtc_offer'&&o.toPid===remotePid));
        OUTBOX.push({id:'OFF_'+Date.now(),type:'rtc_offer',fromPid:S.id,toPid:remotePid,payload:{sdp:off},ts:Date.now()});
        await pushMyPlayerDoc();
      }).catch(()=>{});
    }
    return pc;
  }

  async function handleSignal(msg){
    try{
      if(msg.type==='rtc_offer'){
        await ensureMic();
        const pc=getOrCreatePeer(msg.fromPid,false);
        await pc.setRemoteDescription(new RTCSessionDescription(msg.payload.sdp));
        const ans=await pc.createAnswer();
        await pc.setLocalDescription(ans);
        OUTBOX=OUTBOX.filter(o=>!(o.type==='rtc_answer'&&o.toPid===msg.fromPid));
        OUTBOX.push({id:'ANS_'+Date.now(),type:'rtc_answer',fromPid:S.id,toPid:msg.fromPid,payload:{sdp:ans},ts:Date.now()});
        await pushMyPlayerDoc();
      }else if(msg.type==='rtc_answer'){
        const pc=peers[msg.fromPid];
        if(pc&&pc.signalingState!=='stable')await pc.setRemoteDescription(new RTCSessionDescription(msg.payload.sdp));
      }else if(msg.type==='rtc_ice'){
        const pc=peers[msg.fromPid];
        if(pc&&msg.payload.cand)await pc.addIceCandidate(new RTCIceCandidate(msg.payload.cand));
      }
    }catch(e){}
  }

  async function toggleMic(){
    MIC_ON=!MIC_ON;
    if(MIC_ON){
      const st=await ensureMic();
      if(st)st.getAudioTracks().forEach(t=>t.enabled=true);
      squadMembers().filter(m=>!m.me).forEach(m=>getOrCreatePeer(m.pid,true));
    }else if(stream){
      stream.getAudioTracks().forEach(t=>t.enabled=false);
    }
    pushMyPlayerDoc();
    render();
    if(AR)AR.renderTeamHud();
    toast(MIC_ON?'🎤 Squad Mic ON':'🔇 Squad Mic MUTED');
  }

  function toggleSpeaker(pid=null){
    if(pid){
      MUTED_PEERS[pid]=!MUTED_PEERS[pid];
      if(audios[pid])audios[pid].muted=!SPK_ON||!!MUTED_PEERS[pid];
      toast(MUTED_PEERS[pid]?'🔇 Muted teammate audio':'🔊 Unmuted teammate audio');
    }else{
      SPK_ON=!SPK_ON;
      Object.keys(audios).forEach(k=>{audios[k].muted=!SPK_ON||!!MUTED_PEERS[k]});
      pushMyPlayerDoc();
      toast(SPK_ON?'🔊 Team Speaker ON':'🔈 Team Speaker MUTED');
    }
    render();
    if(AR)AR.renderTeamHud();
  }

  function closeAll(){
    Object.values(peers).forEach(pc=>{try{pc.close()}catch(e){}});
    peers={};
  }
  return{toggleMic,toggleSpeaker,handleSignal,closeAll};
})();

/* ===== FOCUS TIMER WITH SCREEN WAKE LOCK ===== */
async function reqWake(){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function relWake(){try{if(wakeLock){wakeLock.release();wakeLock=null}}catch(e){}}
function startFocus(mins,qid=null,title='Deep Focus Session'){
  if(focusInt)clearInterval(focusInt);
  const tot=Math.max(10,Math.round(mins*60));
  focusState={rem:tot,tot,mins,qid,title};
  reqWake();renderFocus();
  focusInt=setInterval(()=>{
    if(!focusState)return;
    focusState.rem--;
    if(focusState.rem<=0){
      clearInterval(focusInt);focusInt=null;relWake();
      const doneState=focusState;focusState=null;
      S.focusMins=(S.focusMins||0)+doneState.mins;
      const earnedCp=Math.max(10,Math.round(doneState.mins*0.8));
      if(doneState.qid){doQuest(doneState.qid,earnedCp)}
      else{S.cp+=earnedCp;S.coins+=doneState.mins*2;SFX.lvlup();addXP(doneState.mins*3);toast('FOCUS COMPLETE! +'+earnedCp+' 💎 CP · +'+(doneState.mins*2)+' 🪙');save();render()}
      const el=document.getElementById('fscr');if(el)el.remove();
    }else renderFocus();
  },1000);
}
function stopFocus(){if(confirm('Abort focus session? You will forfeit the CP reward.')){clearInterval(focusInt);focusInt=null;focusState=null;relWake();const el=document.getElementById('fscr');if(el)el.remove();toast('Focus session aborted')}}
function renderFocus(){
  if(!focusState)return;
  let el=document.getElementById('fscr');
  if(!el){el=document.createElement('div');el.id='fscr';el.className='fscr';document.body.appendChild(el)}
  const m=String(Math.floor(focusState.rem/60)).padStart(2,'0'),s=String(focusState.rem%60).padStart(2,'0');
  const pct=Math.round((1-focusState.rem/focusState.tot)*100);
  el.innerHTML='<div class="s" style="color:var(--y)">🔒 SCREEN WAKE LOCK ACTIVE</div><h2 style="margin-top:6px">'+esc(focusState.title)+'</h2><div class="ftm">'+m+':'+s+'</div><div class="bar" style="width:min(340px,75vw);height:.6rem"><i style="width:'+pct+'%"></i></div><p class="s" style="margin:10px 0 18px">Stay locked in until 00:00 to claim XP, Credits & CP (💎)</p><button class="sm danger" onclick="stopFocus()">ABORT SESSION</button>';
}

      x.fillStyle='#0f172a';x.fillRect(wx-4,wy-4,76,58);
      x.fillStyle='#38bdf8';x.fillRect(wx,wy,68,50);
      x.fillStyle='rgba(255,255,255,.25)';x.fillRect(wx+4,wy+4,24,42);
    });
  });

  const barrierTex=mk(256,64,(x,w,h)=>{
    for(let i=0;i<8;i++){x.fillStyle=i%2?'#dc2626':'#f8fafc';x.fillRect(i*32,0,32,h)}
  });
  barrierTex.repeat.set(14,1);

  return{groundTex,roadTex,wallTex,barrierTex};
}

function makeSoldierAvatar(opts={}){
  const grp=new THREE.Group();
  const armorCol=opts.armorCol||0x2e64b8;
  const gunId=opts.gunId>=0?opts.gunId:3;
  let mix=null,actIdle=null,actRun=null;

  if(GLTF_CACHE.soldier&&THREE.SkeletonUtils){
    const m=THREE.SkeletonUtils.clone(GLTF_CACHE.soldier.scene);
    const b=new THREE.Box3().setFromObject(m),sz=b.getSize(new THREE.Vector3());
    m.scale.setScalar(2.45/sz.y);
    m.traverse(o=>{
      if(o.isMesh){
        o.visible=true;o.frustumCulled=false;
        if(o.material){
          o.material=o.material.clone();
          o.material.transparent=false;o.material.opacity=1;o.material.side=THREE.DoubleSide;
          if(opts.tint&&o.material.color)o.material.color.lerp(new THREE.Color(opts.tint),.45);
        }
      }
    });
    grp.add(m);
    mix=new THREE.AnimationMixer(m);
    const clips=GLTF_CACHE.soldier.animations||[];
    if(clips[0])actIdle=mix.clipAction(clips[0]);
    if(clips[1])actRun=mix.clipAction(clips[1]);
    if(actIdle)actIdle.play();
  }else{
    const bm=new THREE.MeshStandardMaterial({color:armorCol,roughness:.5,metalness:.3});
    const dm=new THREE.MeshStandardMaterial({color:0x1e293b,roughness:.6});
    const torso=new THREE.Mesh(new THREE.BoxGeometry(.85,1.1,.5),bm);torso.position.y=1.45;
    const head=new THREE.Mesh(new THREE.BoxGeometry(.48,.48,.48),new THREE.MeshStandardMaterial({color:0xe0b696}));head.position.y=2.3;
    const helm=new THREE.Mesh(new THREE.SphereGeometry(.34,12,8,0,6.28,0,1.5),dm);helm.position.y=2.4;
    const legL=new THREE.Mesh(new THREE.BoxGeometry(.32,.9,.35),dm);legL.position.set(-.22,.45,0);
    const legR=legL.clone();legR.position.x=.22;
    grp.add(torso,head,helm,legL,legR);
  }

  const gunMount=new THREE.Group();
  gunMount.position.set(.26,1.46,-.32);
  const gunMesh=build3DGun(gunId);
  gunMesh.scale.setScalar(.82);
  gunMount.add(gunMesh);
  grp.add(gunMount);

  if(opts.label)grp.add(makeNameSprite(opts.label,!!opts.isLeader));

  return{grp,gunMount,getGun:()=>gunMount.children[0],setGun(newId){gunMount.clear();const ng=build3DGun(newId);ng.scale.setScalar(.82);gunMount.add(ng)},mix,actIdle,actRun};
}

/* ===== CUSTOM HUD LAYOUT EDITOR ===== */
const HUD_META=[
  ['joy','JOYSTICK'],['fire','FIRE'],['scope','SCOPE'],['jump','JUMP'],
  ['reload','RELOAD'],['grenade','GRENADE'],['wswitch','GUN SWITCH'],['cam','EYE CAM'],['minimap','RADAR MAP']

let selHud='fire';
function openHudEditor(){
  if(document.getElementById('hud-ed'))return;
  const ed=document.createElement('div');ed.id='hud-ed';ed.className='hud-ed';
  const curH=S.cfg.hud[selHud]||{x:50,y:50,s:100,o:90};
  ed.innerHTML='<div class="hud-bar"><b style="color:var(--y)">🎛️ CUSTOM HUD</b>'+
    '<span class="s" id="hsel-lbl">Selected: '+selHud.toUpperCase()+'</span>'+
    '<label class="s">Size <input id="hs-rng" type="range" min="60" max="150" value="'+curH.s+'" style="width:5.5rem" oninput="updHudProp(\'s\',+this.value)"></label>'+
    '<label class="s">Opacity <input id="ho-rng" type="range" min="30" max="100" value="'+curH.o+'" style="width:5.5rem" oninput="updHudProp(\'o\',+this.value)"></label>'+
    '<button class="sm alt" onclick="S.cfg.hud=defHud();save();refreshHudEd();if(AR)AR.applyHud()">RESET</button>'+
    '<button class="sm" onclick="save();if(AR)AR.applyHud();document.getElementById(\'hud-ed\').remove();toast(\'Custom HUD layout saved!\')">SAVE & CLOSE</button></div>'+
    HUD_META.map(([k,lbl])=>{
      const c=S.cfg.hud[k]||defHud()[k],sz=k==='joy'?96:k==='fire'?72:k==='minimap'?80:56;
      return '<div class="hud-item'+(selHud===k?' sel':'')+'" id="hi-'+k+'" data-k="'+k+'" style="left:'+c.x+'%;top:'+c.y+'%;width:'+sz+'px;height:'+sz+'px;transform:scale('+(c.s/100)+');opacity:'+(c.o/100)+'">'+lbl+'</div>';
    }).join('');
  document.body.appendChild(ed);

  let dragK=null,ox=0,oy=0;
  ed.querySelectorAll('.hud-item').forEach(el=>{
    el.addEventListener('pointerdown',e=>{
      e.stopPropagation();dragK=el.dataset.k;selHud=dragK;
      el.setPointerCapture(e.pointerId);
      const p=normPt(e.clientX,e.clientY),r=el.getBoundingClientRect();
      ox=p.x-(isPortrait()?r.top:r.left);oy=p.y-(isPortrait()?window.innerWidth-r.right:r.top);
      refreshHudEd();
    });
    el.addEventListener('pointermove',e=>{
      if(dragK!==el.dataset.k)return;
      const p=normPt(e.clientX,e.clientY);
      const W=isPortrait()?window.innerHeight:window.innerWidth;
      const H=isPortrait()?window.innerWidth:window.innerHeight;
      const nx=Math.max(1,Math.min(90,Math.round(((p.x-ox)/W)*100)));
      const ny=Math.max(8,Math.min(86,Math.round(((p.y-oy)/H)*100)));
      S.cfg.hud[dragK].x=nx;S.cfg.hud[dragK].y=ny;
      el.style.left=nx+'%';el.style.top=ny+'%';
    });
    el.addEventListener('pointerup',()=>{dragK=null});
  });
}
function updHudProp(prop,val){
  if(!S.cfg.hud[selHud])return;
  S.cfg.hud[selHud][prop]=val;
  const el=document.getElementById('hi-'+selHud);
  if(el){el.style.transform='scale('+(S.cfg.hud[selHud].s/100)+')';el.style.opacity=S.cfg.hud[selHud].o/100}
  if(AR)AR.applyHud();
}
function refreshHudEd(){
  const ed=document.getElementById('hud-ed');if(!ed)return;
  ed.querySelectorAll('.hud-item').forEach(el=>el.classList.toggle('sel',el.dataset.k===selHud));
  const c=S.cfg.hud[selHud];
  const l=document.getElementById('hsel-lbl'),sr=document.getElementById('hs-rng'),or=document.getElementById('ho-rng');
  if(l)l.textContent='Selected: '+selHud.toUpperCase();
  if(sr)sr.value=c.s;if(or)or.value=c.o;
}

    cr.position.set(cp[0],.55,cp[2]);sc.add(cr);crates.push({m:cr,got:0});

  function updJoy(e){
    const p=normPt(e.clientX,e.clientY),r=joy.getBoundingClientRect();
    const cx=isPortrait()?(r.top+r.height/2):(r.left+r.width/2);

    let dx=(p.x-cx)/36,dy=(p.y-cy)/36;

    lx=p.x;ly=p.y;
  });
  cv.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});

  const onKd=e=>{st.keys[e.code]=1;if(e.code==='Space')AR.jump();if(e.code==='KeyR')AR.reload();if(e.code==='KeyF')AR.shoot();if(e.code==='KeyQ')AR.switchGun();if(e.code==='KeyV')AR.toggleCam();if(e.code==='ShiftLeft')AR.toggleScope()};
  const onKu=e=>{st.keys[e.code]=0};
  addEventListener('keydown',onKd);addEventListener('keyup',onKu);

  function setFeed(txt){const f=document.getElementById('mfeed');if(f)f.textContent=txt}
  function updHud(){
    const a=document.getElementById('am-cnt'),ag=document.getElementById('am-gun'),h=document.getElementById('hp-txt'),hb=document.getElementById('hp-bar'),k=document.getElementById('kl-txt');
    if(a)a.textContent=String(st.ammo).padStart(2,'0');
    if(ag)ag.textContent=ownedGuns[gunIdx].name;
    if(h)h.textContent=Math.max(0,Math.round(st.hp));
    if(hb)hb.style.width=Math.max(0,st.hp)+'%';
    if(k)k.textContent=st.kills+'/6';
  }
  function spawnBoom(pos,col=0xffa500){
    const b=new THREE.Mesh(new THREE.SphereGeometry(.5,10,10),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.9}));
    b.position.copy(pos);sc.add(b);booms.push({m:b,t:0});
  }
  function drawRadar(){
    const rc=document.getElementById('radar');if(!rc)return;
    const x=rc.getContext('2d');x.clearRect(0,0,80,80);
    x.fillStyle='#061024cc';x.beginPath();x.arc(40,40,38,0,6.28);x.fill();
    x.strokeStyle='#4aa8ff55';x.beginPath();x.arc(40,40,20,0,6.28);x.stroke();
    enemies.forEach(en=>{if(!en.alive)return;const dx=(en.g.position.x-player.position.x)*.72,dz=(en.g.position.z-player.position.z)*.72;if(Math.hypot(dx,dz)<36){x.fillStyle='#ff2a55';x.beginPath();x.arc(40+dx,40+dz,3,0,6.28);x.fill()}});
    crates.forEach(cr=>{if(cr.got)return;const dx=(cr.m.position.x-player.position.x)*.72,dz=(cr.m.position.z-player.position.z)*.72;if(Math.hypot(dx,dz)<36){x.fillStyle='#f5d300';x.fillRect(38+dx,38+dz,4,4)}});
    Object.values(matePositions).forEach(mp=>{const dx=(mp.x-player.position.x)*.72,dz=(mp.z-player.position.z)*.72;if(Math.hypot(dx,dz)<36){x.fillStyle='#38bdf8';x.beginPath();x.arc(40+dx,40+dz,3.5,0,6.28);x.fill()}});
    x.fillStyle='#5be58a';x.beginPath();x.arc(40,40,3.5,0,6.28);x.fill();
  }

  AR={
    paused:0,
    renderTeamHud(){
      const slot=document.getElementById('arena-team-slot');
      if(slot)slot.innerHTML=renderTeamHudHtml(true);
    },
    setMatePos(pid,pos){matePositions[pid]=pos},
    applyHud(){
      HUD_META.forEach(([k])=>{
        const el=document.getElementById('hc-'+k),c=S.cfg.hud[k];
        if(el&&c){el.style.left=c.x+'%';el.style.top=c.y+'%';el.style.transform='scale('+(c.s/100)+')';el.style.opacity=c.o/100}
      });
    },
    toggleScope(){
      st.scoped=!st.scoped;
      SFX.click();
      const ov=document.getElementById('scope-ov'),bs=document.getElementById('btn-scope');
      if(ov)ov.classList.toggle('on',!!st.scoped);
      if(bs)bs.classList.toggle('scoped',!!st.scoped);
      fpGun.position.x=st.scoped?0:.26;
      fpGun.position.y=st.scoped?-.19:-.25;
      setFeed(st.scoped?'🎯 TACTICAL SCOPE ENGAGED (2.2x ZOOM)':'🎯 HIPFIRE MODE');
    },
    toggleCam(){
      st.fp=!st.fp;
      player.visible=!st.fp;
      fpGun.visible=!!st.fp;
      setFeed(st.fp?'👁️ 1ST-PERSON RIFLE VIEW':'👁️ 3RD-PERSON TACTICAL VIEW');
    },
    switchGun(){
      gunIdx=(gunIdx+1)%ownedGuns.length;
      const gid=ownedGuns[gunIdx].id;
      SFX.equip('gun',ownedGuns[gunIdx].r);
      playerAv.setGun(gid);
      cam.remove(fpGun);fpGun=build3DGun(gid);fpGun.scale.setScalar(.85);fpGun.position.set(st.scoped?0:.26,st.scoped?-.19:-.25,-.52);fpGun.visible=!!st.fp;cam.add(fpGun);
      updHud();setFeed('EQUIPPED: '+ownedGuns[gunIdx].name);
    },
    openSettings(){
      AR.paused=1;
      const m=document.createElement('div');m.className='modal';
      m.innerHTML='<div class="pop R" style="max-width:29rem"><div class="rR">⚙️ BATTLE SETTINGS</div><h2 style="margin:6px 0">QUICK TACTICAL CONTROLS</h2>'+
        '<div class="fr"><div style="flex:1;text-align:left"><b>Aim Sensitivity ('+S.cfg.sens+'%)</b></div><input type="range" min="20" max="200" value="'+S.cfg.sens+'" style="width:8rem" onchange="S.cfg.sens=+this.value;save()"></div>'+
        '<div class="fr"><div style="flex:1;text-align:left"><b>SFX Volume ('+S.cfg.vol+'%)</b></div><input type="range" min="0" max="100" value="'+S.cfg.vol+'" style="width:8rem" onchange="S.cfg.vol=+this.value;save()"></div>'+
        '<div class="fr"><div style="flex:1;text-align:left"><b>Custom HUD Layout</b><div class="s">Move & resize Fire, Scope, Jump, Gun Switch & Joystick</div></div><button class="sm" onclick="this.closest(\'.modal\').remove();openHudEditor()">🎛️ CUSTOM HUD</button></div>'+
        '<div class="row" style="justify-content:center;margin-top:10px"><button class="sm alt" onclick="this.closest(\'.modal\').remove();if(AR)AR.paused=0">RESUME MATCH</button><button class="sm danger" onclick="this.closest(\'.modal\').remove();confirmExitMatch()">EXIT MATCH</button></div></div>';
      document.body.appendChild(m);
    },
    jump(){if(st.grounded){st.vy=7.5;st.grounded=0}},
    reload(){if(st.ammo===30)return;SFX.reload();st.ammo=30;updHud();setFeed('MAGAZINE RELOADED (30/30)')},
    shoot(){
      if(st.ended||AR.paused)return;
      if(st.ammo<=0){setFeed('OUT OF AMMO! TAP 🔄 TO RELOAD');return}
      st.ammo--;updHud();SFX.shot();
      const activeG=st.fp?fpGun:playerAv.getGun();
      if(activeG&&activeG.userData.flash){activeG.userData.flash.visible=true;setTimeout(()=>{if(activeG.userData.flash)activeG.userData.flash.visible=false},65)}
      const dir=new THREE.Vector3(-Math.sin(st.yaw),0,-Math.cos(st.yaw)).normalize();
      const b=new THREE.Mesh(new THREE.SphereGeometry(.15,6,6),new THREE.MeshBasicMaterial({color:RAR[ownedGuns[gunIdx].r].c}));
      b.position.set(player.position.x,player.position.y+1.45,player.position.z).addScaledVector(dir,1.1);
      sc.add(b);bullets.push({m:b,v:dir.clone().multiplyScalar(64),life:.95,isGrenade:0,dmg:st.scoped?75:50});
      if(st.fp)fpGun.position.z=-.40;
    },
    grenade(){
      if(st.ended||AR.paused)return;
      SFX.click();
      const dir=new THREE.Vector3(-Math.sin(st.yaw),.38,-Math.cos(st.yaw)).normalize();
      const g=new THREE.Mesh(new THREE.DodecahedronGeometry(.25,0),new THREE.MeshStandardMaterial({color:0x22c55e}));
      g.position.set(player.position.x,player.position.y+1.6,player.position.z);
      sc.add(g);bullets.push({m:g,v:dir.multiplyScalar(22),life:1.3,isGrenade:1,dmg:100});
      setFeed('FRAG GRENADE OUT!');
    },
    cleanup(){removeEventListener('keydown',onKd);removeEventListener('keyup',onKu);ren.dispose()}
  };
  AR.applyHud();updHud();

  const ck=new THREE.Clock();
  (function loop(){
    if(!AR)return;
    requestAnimationFrame(loop);
    if(AR.paused)return;
    const dt=Math.min(.05,ck.getDelta()),t=ck.elapsedTime;
    if(playerAv.mix)playerAv.mix.update(dt);
    Object.values(mateAvs).forEach(av=>{if(av.mix)av.mix.update(dt)});
    enemies.forEach(en=>{if(en.alive&&en.mix)en.mix.update(dt)});
    fpGun.position.z+=(-0.52-fpGun.position.z)*.2;

    const targetFov=st.scoped?28:62;
    if(Math.abs(cam.fov-targetFov)>.2){cam.fov+=(targetFov-cam.fov)*.22;cam.updateProjectionMatrix()}

    let mx=st.jx,mz=st.jy;
    if(st.keys.KeyW||st.keys.ArrowUp)mz=-1;
    if(st.keys.KeyS||st.keys.ArrowDown)mz=1;
    if(st.keys.KeyA||st.keys.ArrowLeft)mx=-1;
    if(st.keys.KeyD||st.keys.ArrowRight)mx=1;
    const moving=Math.hypot(mx,mz)>.12;
    if(moving){
      const sin=Math.sin(st.yaw),cos=Math.cos(st.yaw);
      const vx=(mx*cos+mz*sin)*9.5*dt,vz=(-mx*sin+mz*cos)*9.5*dt;
      const nx=Math.max(-45,Math.min(45,player.position.x+vx)),nz=Math.max(-45,Math.min(45,player.position.z+vz));
      if(!colliders.some(c=>Math.abs(nx-c.x)<c.hw&&Math.abs(nz-c.z)<c.hd)){player.position.x=nx;player.position.z=nz}
      player.rotation.y=st.scoped?(st.yaw+Math.PI):Math.atan2(vx,vz);
    }else if(st.fp||st.scoped){
      player.rotation.y=st.yaw+Math.PI;
    }

    if(playerAv.actRun&&playerAv.actIdle){
      if(moving&&!playerAv.actRun.isRunning()){playerAv.actIdle.stop();playerAv.actRun.play()}
      else if(!moving&&playerAv.actRun.isRunning()){playerAv.actRun.stop();playerAv.actIdle.play()}
    }

    if(!st.grounded){
      player.position.y+=st.vy*dt;st.vy-=20*dt;
      if(player.position.y<=0){player.position.y=0;st.vy=0;st.grounded=1}
    }

    if(st.fp){
      cam.position.set(player.position.x,player.position.y+1.75,player.position.z);
      cam.rotation.order='YXZ';cam.rotation.y=st.yaw;cam.rotation.x=-st.pitch;
    }else{
      const dist=st.scoped?2.4:5.2,shoulderX=Math.cos(st.yaw)*(st.scoped?.45:.65),shoulderZ=-Math.sin(st.yaw)*(st.scoped?.45:.65);
      cam.position.set(player.position.x+Math.sin(st.yaw)*dist+shoulderX,player.position.y+(st.scoped?1.95:2.45)+st.pitch*2.4,player.position.z+Math.cos(st.yaw)*dist+shoulderZ);
      cam.lookAt(player.position.x+shoulderX,player.position.y+1.45,player.position.z+shoulderZ);
    }

    /* Sync Co-Op Squad Position via own players/{uid} document */
    if(squadId&&DB&&USER&&t-lastSync>.3){
      lastSync=t;
      pushMyPlayerDoc({pos:{x:+player.position.x.toFixed(2),z:+player.position.z.toFixed(2),yaw:+player.rotation.y.toFixed(2),kills:st.kills}});
    }
    Object.keys(mateAvs).forEach(pid=>{
      const av=mateAvs[pid],mp=matePositions[pid];
      if(av&&mp){
        av.grp.position.x+=(mp.x-av.grp.position.x)*.22;
        av.grp.position.z+=(mp.z-av.grp.position.z)*.22;
        av.grp.rotation.y=mp.yaw;
      }
    });

    crates.forEach(cr=>{
      if(cr.got)return;
      cr.m.rotation.y+=dt*2;
      if(cr.m.position.distanceTo(player.position)<2){
        cr.got=1;cr.m.visible=false;SFX.coin();
        setFeed('SUPPLY CRATE LOOTED! (+10 💎 CP BONUS)');
      }
    });

    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];b.life-=dt;
      b.m.position.addScaledVector(b.v,dt);
      if(b.isGrenade)b.v.y-=18*dt;
      let hit=0;
      enemies.forEach(en=>{
        if(!en.alive)return;
        const d=b.m.position.distanceTo(new THREE.Vector3(en.g.position.x,1.15,en.g.position.z));
        if(d<(b.isGrenade?4.5:1.4)){
          hit=1;en.hp-=b.dmg;
          en.hb.scale.x=Math.max(.01,en.hp/100);
          spawnBoom(b.m.position,b.isGrenade?0xff5500:0xf5d300);
          if(en.hp<=0){
            en.alive=0;en.g.visible=false;st.kills++;updHud();
            setFeed('ENEMY ELIMINATED! ('+st.kills+'/6)');
            if(st.kills>=6&&!st.ended){st.ended=1;setTimeout(()=>exitMatch(true,true),700)}
          }
        }
      });
      if(hit||b.life<=0||(b.isGrenade&&b.m.position.y<=.2)){
        if(b.isGrenade){SFX.boom();spawnBoom(b.m.position,0xff3b5c)}
        sc.remove(b.m);bullets.splice(i,1);
      }
    }

    enemies.forEach(en=>{
      if(!en.alive)return;
      en.g.position.x+=Math.sin(t+en.phase)*dt*2.4*en.dir;
      en.g.rotation.y=Math.cos(t+en.phase)*en.dir>0?Math.PI/2:-Math.PI/2;
      if(en.g.position.distanceTo(player.position)<7&&Math.random()<dt*.6){
        st.hp=Math.max(15,st.hp-4);updHud();
      }
    });

    for(let i=booms.length-1;i>=0;i--){
      const bm=booms[i];bm.t+=dt;bm.m.scale.setScalar(1+bm.t*7);bm.m.material.opacity=Math.max(0,1-bm.t*3);
      if(bm.t>.35){sc.remove(bm.m);booms.splice(i,1)}
    }

    drawRadar();
    ren.render(sc,cam);
  })();
}

function exitMatch(claim=true,victory=false){
  const el=document.getElementById('arena');
  let earnedKills=0;
  const kTxt=document.getElementById('kl-txt');
  if(kTxt)earnedKills=parseInt(kTxt.textContent)||0;
  if(AR){AR.cleanup();AR=null}
  if(el)el.remove();
  if(SQUAD){SQUAD.status='lobby';MY_READY=false;pushMyPlayerDoc()}
  if(!claim)return;

  const won=victory||earnedKills>=6;
  const mapBonus=S.map==='shipment'&&won?10:0;
  const co=25+earnedKills*15+(won?50:0);
  const cp=5+earnedKills*5+(won?25:0)+mapBonus;
  const xp=30+earnedKills*20+(won?60:0);
  S.coins+=co;S.cp+=cp;if(won){S.wins=(S.wins||0)+1;S.keys+=1}
  SFX.lvlup();addXP(xp);save();render();

  const m=document.createElement('div');m.className='modal';m.onclick=()=>{m.remove();render()};
  m.innerHTML='<div class="pop '+(won?'L':'R')+'"><div class="'+(won?'rL':'rR')+'">'+(won?'🏆 VICTORY ROYALE':'🏁 MATCH EXTRACTED')+'</div><div class="big">🎖️</div><h2>'+esc(activeMap().name)+'</h2><p class="s" style="margin:6px 0">Eliminations: '+earnedKills+'/6</p><div style="background:#0007;padding:10px;margin:10px 0;font-weight:700">+'+xp+' XP · +'+co+' 🪙 · +'+cp+' 💎 CP'+(won?' · +1 🗝️ KEY':'')+'</div><p class="s">Rewards added to your profile · Tap to continue</p></div>';
  document.body.appendChild(m);
}

/* ===== 5-PLAYER MULTIPLAYER SQUAD, READY SYSTEM & OUTBOX ENGINE ===== */
let INBOX=[],OUTBOX=[],SQUAD=null,MY_READY=false,LAST_MATCH_ID='',unsubOutbox=null,unsubSquad=null,handledIds={},FRIEND_DOCS={},SQUAD_DOCS={};

function pushMyPlayerDoc(extra={}){
  if(!DB||!USER)return Promise.resolve();
  const T=firebase.firestore.FieldValue.serverTimestamp();
  const targets=[...new Set(OUTBOX.map(o=>o.toPid))];
  const doc=Object.assign({
    pid:S.id,n:S.name,l:S.lvl,c:Object.keys(S.owned).length,s:S.streak,
    a:S.eq.char>=0?ITEMS[S.eq.char].ic:'🪖',
    eq:S.eq,map:S.map,
    squadId:SQUAD?SQUAD.id:'',
    squadLeaderPid:SQUAD?SQUAD.leaderPid:'',
    squadStatus:SQUAD?SQUAD.status:'',
    squadMatchId:SQUAD?SQUAD.matchId||'':'',
    squadReady:SQUAD?(SQUAD.leaderPid===S.id?true:!!MY_READY):false,
    micOn:!!MIC_ON,
    spkOn:!!SPK_ON,
    outbox:OUTBOX.slice(-24),
    outboxTargets:targets,
    t:T
  },extra);
  return DB.collection('players').doc(USER.uid).set(doc,{merge:true});
}

function listenSquad(){
  if(unsubSquad){unsubSquad();unsubSquad=null}
  SQUAD_DOCS={};
  if(!DB||!USER||!SQUAD)return;
  unsubSquad=DB.collection('players').where('squadId','==',SQUAD.id).onSnapshot(sn=>{
    const next={};
    sn.forEach(d=>{
      const x=d.data();
      next[x.pid]=x;
      if(AR&&x.pid!==S.id&&x.pos)AR.setMatePos(x.pid,x.pos);
    });
    SQUAD_DOCS=next;
    /* Check if Leader changed map or launched the 3D Battle Arena */
    const leaderDoc=next[SQUAD.leaderPid];
    if(leaderDoc&&SQUAD.leaderPid!==S.id){
      if(leaderDoc.map&&leaderDoc.map!==S.map){S.map=leaderDoc.map}
      if(leaderDoc.squadStatus==='started'&&leaderDoc.squadMatchId&&leaderDoc.squadMatchId!==LAST_MATCH_ID&&!AR){
        LAST_MATCH_ID=leaderDoc.squadMatchId;
        SQUAD.status='started';
        startMatch(SQUAD.id);
      }
    }
    updateLobbySquad();
    if(AR)AR.renderTeamHud();
    else render();
  },err=>console.warn('Squad listener:',err));
}

function listenMultiplayer(){
  if(unsubOutbox)unsubOutbox();
  if(!DB||!USER)return;
  unsubOutbox=DB.collection('players').where('outboxTargets','array-contains',S.id).onSnapshot(sn=>{
    const nextInbox=[];
    sn.forEach(d=>{
      const sender=d.data();
      (sender.outbox||[]).forEach(msg=>{
        if(msg.toPid!==S.id)return;
        if(msg.type==='rtc_offer'||msg.type==='rtc_answer'||msg.type==='rtc_ice'){
          if(!handledIds[msg.id]){handledIds[msg.id]=1;VOICE.handleSignal(msg)}
          return;
        }
        if(msg.type==='friend_ack'){
          if(!handledIds[msg.id]){
            handledIds[msg.id]=1;
            S.friends=S.friends.filter(f=>f.i!==msg.fromPid);
            S.friends.push({n:msg.fromName,i:msg.fromPid,l:msg.payload?.lvl||1,c:msg.payload?.owned||2,s:msg.payload?.streak||0,a:msg.fromAvatar||'🪖',eq:msg.payload?.eq||{gun:3,skin:-1,char:-1}});
            save();listenFriends();SFX.lvlup();
            toast('🤝 '+esc(msg.fromName)+' accepted your Friend Request!');
          }
          return;
        }
        if(handledIds[msg.id])return;
        nextInbox.push(Object.assign({senderUid:d.id},msg));
        if(!handledIds['toast_'+msg.id]){
          handledIds['toast_'+msg.id]=1;
          SFX.quest();
          if(msg.type==='match_invite')showMatchInviteModal(msg);
          else if(msg.type==='gift')toast('🎁 Gift from '+esc(msg.fromName)+': '+esc(msg.payload?.label||'')+'! Open Clan → Invitations');
          else toast('📩 Friend Request from '+esc(msg.fromName)+'! Open Clan → Invitations');
        }
      });
    });
    INBOX=nextInbox;
    if(!AR)render();
  },err=>console.warn('Inbox listener:',err));
}

async function sendFriendReqById(targetPid){
  const pid=(targetPid||document.getElementById('fid')?.value||'').trim().toUpperCase();
  if(!DB||!USER)return toast('Sign in with Google first!');
  if(!pid||pid===S.id)return toast('Enter your friend\'s Player ID');
  try{
    const q=await DB.collection('players').where('pid','==',pid).limit(1).get();
    if(q.empty)return toast('No player found with ID '+esc(pid)+'. Make sure your friend signed in with Google!');
    const x=q.docs[0].data();
    const msgId='MSG_'+Date.now()+'_'+Math.floor(Math.random()*9999);
    OUTBOX=OUTBOX.filter(o=>!(o.type==='friend_req'&&o.toPid===x.pid));
    OUTBOX.push({
      id:msgId,type:'friend_req',fromUid:USER.uid,fromPid:S.id,fromName:S.name,
      fromAvatar:S.eq.char>=0?ITEMS[S.eq.char].ic:'🪖',
      toPid:x.pid,
      payload:{lvl:S.lvl,owned:Object.keys(S.owned).length,streak:S.streak,eq:S.eq},
      ts:Date.now()
    });
    await pushMyPlayerDoc();
    SFX.coin();toast('✅ Friend Request sent to '+esc(x.n)+' ('+x.pid+')!');
  }catch(e){toast('Could not send invite: '+esc(e.message))}
}

async function acceptInvite(msgId){
  const inv=INBOX.find(i=>i.id===msgId);if(!inv||!DB)return;
  handledIds[msgId]=1;
  INBOX=INBOX.filter(i=>i.id!==msgId);
  if(inv.type==='friend_req'){
    S.friends=S.friends.filter(f=>f.i!==inv.fromPid);
    S.friends.push({n:inv.fromName,i:inv.fromPid,l:inv.payload?.lvl||1,c:inv.payload?.owned||2,s:inv.payload?.streak||0,a:inv.fromAvatar||'🪖',eq:inv.payload?.eq||{gun:3,skin:-1,char:-1}});
    OUTBOX.push({
      id:'ACK_'+Date.now(),type:'friend_ack',fromUid:USER.uid,fromPid:S.id,fromName:S.name,
      fromAvatar:S.eq.char>=0?ITEMS[S.eq.char].ic:'🪖',
      toPid:inv.fromPid,
      payload:{lvl:S.lvl,owned:Object.keys(S.owned).length,streak:S.streak,eq:S.eq},
      ts:Date.now()
    });
    save();listenFriends();await pushMyPlayerDoc();
    SFX.lvlup();toast('🤝 You and '+esc(inv.fromName)+' are now Friends!');
  }else if(inv.type==='gift'){
    const p=inv.payload||{};
    S.coins+=(p.coins||0);S.keys+=(p.keys||0);S.cp+=(p.cp||0);
    save();SFX.lvlup();toast('🎁 Claimed Gift from '+esc(inv.fromName)+': '+esc(p.label||'Reward')+'!');
  }else if(inv.type==='match_invite'){
    await joinSquadWithFriend(inv.fromPid,inv.fromName,inv.payload?.map||S.map);
  }
  render();
}
function declineInvite(msgId){handledIds[msgId]=1;INBOX=INBOX.filter(i=>i.id!==msgId);render()}

async function sendGift(toPid,toName,kind){
  if(!DB||!USER)return toast('Sign in with Google first');
  let costCur='coins',cost=50,payload={coins:50,label:'50 Basic Coins (🪙)'};
  if(kind==='key'){costCur='keys';cost=1;payload={keys:1,label:'1 Armory Key (🗝️)'}}
  if(kind==='cp'){costCur='cp';cost=15;payload={cp:15,label:'15 CP (💎)'}}
  if(S[costCur]<cost)return toast('Not enough '+costCur.toUpperCase()+' to send this gift');
  S[costCur]-=cost;save();
  OUTBOX.push({
    id:'GFT_'+Date.now(),type:'gift',fromUid:USER.uid,fromPid:S.id,fromName:S.name,fromAvatar:'🎁',
    toPid,payload,ts:Date.now()
  });
  await pushMyPlayerDoc();render();
  SFX.coin();toast('🎁 Sent '+payload.label+' to '+esc(toName)+'!');
}

async function inviteFriendToPlay(toPid,toName){
  if(!DB||!USER)return toast('Sign in with Google first');
  const sq=squadMembers();
  if(sq.length>=5)return toast('Squad is full (Max 5 players)!');
  if(!SQUAD){
    SQUAD={id:'SQ_'+S.id,leaderPid:S.id,leaderName:S.name,map:S.map,status:'lobby',matchId:''};
    MY_READY=true;
    listenSquad();
  }else if(SQUAD.leaderPid!==S.id){
    return toast('Only the Squad Leader (👑) can invite new members!');
  }
  OUTBOX=OUTBOX.filter(o=>!(o.type==='match_invite'&&o.toPid===toPid));
  OUTBOX.push({
    id:'SQINV_'+Date.now(),type:'match_invite',fromUid:USER.uid,fromPid:S.id,fromName:S.name,fromAvatar:'🎮',
    toPid,payload:{squadId:SQUAD.id,map:S.map,mapName:activeMap().name},ts:Date.now()
  });
  await pushMyPlayerDoc();
  updateLobbySquad();render();
  toast('🎮 Squad Invite sent to '+esc(toName)+'! ('+sq.length+'/5 in lobby)');
}

async function joinSquadWithFriend(leaderPid,leaderName,mapId){
  SQUAD={id:'SQ_'+leaderPid,leaderPid,leaderName,map:mapId||S.map,status:'lobby',matchId:''};
  MY_READY=false;
  S.map=SQUAD.map;
  listenSquad();
  await pushMyPlayerDoc();
  updateLobbySquad();pg='';render();
  toast('🪖 Joined '+esc(leaderName)+'\'s Squad! Tap READY in the bottom-right when ready!');
}

async function toggleReady(){
  if(!SQUAD||SQUAD.leaderPid===S.id)return;
  MY_READY=!MY_READY;
  SFX.click();
  await pushMyPlayerDoc();
  updateLobbySquad();render();
  toast(MY_READY?'✔ You are READY! Waiting for Squad Leader to press START.':'⏳ Status set to NOT READY');
}

async function leaveSquad(){
  SQUAD=null;MY_READY=false;SQUAD_DOCS={};
  if(unsubSquad){unsubSquad();unsubSquad=null}
  VOICE.closeAll();
  await pushMyPlayerDoc();
  updateLobbySquad();render();
  toast('Left Squad');
}

async function launchSquadMatch(){
  const sq=squadMembers();
  if(SQUAD&&SQUAD.leaderPid!==S.id)return toast('Only the Squad Leader (👑) can start the match!');
  const teammates=sq.filter(m=>!m.me);
  if(teammates.length>0&&!teammates.every(m=>m.ready)){
    const unready=teammates.filter(m=>!m.ready).map(m=>m.name).join(', ');
    return toast('⏳ Waiting for '+esc(unready)+' to tap READY first!');
  }
  if(SQUAD){
    SQUAD.status='started';
    SQUAD.matchId='M_'+Date.now();
    LAST_MATCH_ID=SQUAD.matchId;
    await pushMyPlayerDoc();
  }
  startMatch(SQUAD?SQUAD.id:null);
}

function squadMembers(){
  const leaderPid=SQUAD?SQUAD.leaderPid:S.id;
  const me={pid:S.id,name:S.name,lvl:S.lvl,avatar:S.eq.char>=0?ITEMS[S.eq.char].ic:'🪖',eq:S.eq,ready:leaderPid===S.id?true:MY_READY,isLeader:leaderPid===S.id,micOn:MIC_ON,spkOn:SPK_ON,me:1};
  const list=[me];
  if(SQUAD){
    Object.values(SQUAD_DOCS).forEach(d=>{
      if(d.pid===S.id||list.length>=5)return;
      list.push({
        pid:d.pid,name:d.n||'Player',lvl:d.l||1,avatar:d.a||'🪖',
        eq:d.eq||{gun:3,skin:-1,char:-1},
        ready:d.pid===leaderPid?true:!!d.squadReady,
        isLeader:d.pid===leaderPid,
        micOn:!!d.micOn,spkOn:d.spkOn!==false,me:0
      });
    });
  }
  /* Always put Squad Leader first in slot 0 */
  list.sort((a,b)=>(b.isLeader?1:0)-(a.isLeader?1:0));
  return list.slice(0,5);
}

function drawMapRadar(){
  const cv=document.getElementById('mcv');if(!cv)return;
  const ctx=cv.getContext('2d'),w=cv.width=cv.offsetWidth||320,h=cv.height=165;
  ctx.fillStyle='#060c1a';ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#1b3664';ctx.lineWidth=1;
  for(let x=0;x<w;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
  for(let y=0;y<h;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
  ctx.fillStyle='#334155';ctx.fillRect(w/2-14,0,28,h);ctx.fillRect(0,h/2-12,w,24);
  ctx.fillStyle='#243b6b';ctx.strokeStyle='#4aa8ff';
  [[w/2-75,24,46,32],[w/2+30,24,46,32],[w/2-75,h-56,46,32],[w/2+30,h-56,46,32]].forEach(b=>{
    ctx.fillRect(b[0],b[1],b[2],b[3]);ctx.strokeRect(b[0],b[1],b[2],b[3]);
  });
  ctx.font='bold 10px sans-serif';ctx.textAlign='center';
  ctx.fillStyle='#5be58a';ctx.fillText('5-PLAYER SQUAD SPAWN',w/2,h-14);
  ctx.fillStyle='#ff2a55';ctx.fillText('6 3D SOLDIER BOTS',w/2,16);
}

/* ---------- CLOUD (Firebase Auth + Permanent One-Time Login + Firestore) ---------- */
let AU=null,DB=null,USER=null,cst='Local only',tmr=null,unsub=null,busy=0,inLogin=0,lastDay='';
const TO=()=>({signal:AbortSignal.timeout?AbortSignal.timeout(5000):undefined});
function cloudInit(){
  if(!FB_CONFIG.apiKey||typeof firebase==='undefined')return;
  try{
    firebase.initializeApp(FB_CONFIG);
    AU=firebase.auth();
    DB=firebase.firestore();
    AU.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
    AU.getRedirectResult().catch(e=>{if(e&&e.code)toast('Login failed: '+esc(e.code))});
    AU.onAuthStateChanged(async u=>{
      USER=u;
      if(u){
        /* Mark registered immediately so user NEVER has to log in a second time */
        S.reg=1;S.googleLinked=1;
        if((!S.name||S.name==='Player')&&u.displayName)S.name=u.displayName.split(' ')[0].slice(0,16);
        lsave();
        cst='Signing in...';
        if(inLogin){inLogin=0;loading()}
        await cloudLoad();
        listenMultiplayer();
      }else{
        cst='Local only';
        if(unsub)unsub();
        if(unsubOutbox)unsubOutbox();
      }
      upd();
      if(!busy&&!inLogin)render();
    });
  }catch(e){cst='Cloud error';console.warn(e)}
}
function gLogin(){
  if(!AU)return toast('Cloud is not set up yet.');
  const lnEl=document.getElementById('ln');
  if(lnEl&&lnEl.value.trim()){S.name=lnEl.value.trim().slice(0,16);lsave()}
  const p=new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({prompt:'select_account'});
  AU.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{}).then(()=>{
    AU.signInWithPopup(p).catch(e=>{
      if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')AU.signInWithRedirect(p);
      else if(e.code!=='auth/popup-closed-by-user')toast('Login failed: '+esc(e.code||e.message));
    });
  });
}
async function cloudLoad(){try{await syncClock();const d=await DB.collection('saves').doc(USER.uid).get();
if(d.exists){const c=JSON.parse(d.data().data);if((c.rev||0)>(S.rev||0)){const keptName=S.name&&S.name!=='Player'?S.name:c.name;S=Object.assign(fresh(),c,{reg:1,googleLinked:1});if(keptName)S.name=keptName;if(!S.createdAt)S.createdAt=Date.now();if(typeof S.cp!=='number')S.cp=150;if(typeof S.wins!=='number')S.wins=0;S.cfg=Object.assign(defCfg(),S.cfg||{});S.cfg.hud=Object.assign(defHud(),S.cfg.hud||{});lsave();look();toast('Cloud progress loaded ☁️')}else{S.reg=1;S.googleLinked=1;lsave();await cloudPush()}}
else{S.reg=1;S.googleLinked=1;if((!S.name||S.name==='Player')&&USER.displayName)S.name=USER.displayName.split(' ')[0].slice(0,16);lsave();await cloudPush()}
cst='Synced ✓';listenFriends();if(inLogin&&S.reg){inLogin=0;loading()}}catch(e){cst='Sync failed';console.warn(e)}}
async function cloudPush(){if(!DB||!USER)return;try{cst='Saving...';upd();const b=DB.batch(),T=firebase.firestore.FieldValue.serverTimestamp();
b.set(DB.collection('saves').doc(USER.uid),{data:JSON.stringify(S),rev:S.rev||0,dev:navigator.userAgent.slice(0,90),t:T});
b.set(DB.collection('players').doc(USER.uid),{pid:S.id,n:S.name,l:S.lvl,c:Object.keys(S.owned).length,s:S.streak,a:S.eq.char>=0?ITEMS[S.eq.char].ic:'🪖',eq:S.eq,map:S.map,squadId:SQUAD?SQUAD.id:'',squadLeaderPid:SQUAD?SQUAD.leaderPid:'',squadStatus:SQUAD?SQUAD.status:'',squadMatchId:SQUAD?SQUAD.matchId||'':'',squadReady:SQUAD?(SQUAD.leaderPid===S.id?true:!!MY_READY):false,micOn:!!MIC_ON,spkOn:!!SPK_ON,outbox:OUTBOX.slice(-24),outboxTargets:[...new Set(OUTBOX.map(o=>o.toPid))],t:T},{merge:true});
await b.commit();cst='Synced ✓'}catch(e){cst='Sync failed';console.warn(e)}upd()}

try{if(S.wp==='nasa'){const j=await(await fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY',TO())).json();u=j.media_type==='image'?j.url:null}
else{const d=now(),j=await(await fetch('https://en.wikipedia.org/api/rest_v1/feed/featured/'+d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'),TO())).json();u=j.image&&j.image.thumbnail?j.image.thumbnail.source.replace(/\/\d+px-/,'/1280px-'):null}}catch(e){}
if(u)try{localStorage.setItem(k,u)}catch(e){}return u}
function cloudTab(){const o=(v,t)=>'<option value="'+v+'"'+(S.wp===v?' selected':'')+'>'+t+'</option>';
const pwaRow=isStandalone()?'<div class="fr"><div style="flex:1"><b>Android App Mode</b><div class="s">Installed & offline-ready ✓</div></div></div>':'<div class="fr"><div style="flex:1"><b>Install App on Phone</b><div class="s">Full-screen landscape + offline play ($0)</div></div><button class="sm" onclick="installApp()">'+(PWA_PROMPT?'INSTALL NOW':'HOW TO INSTALL')+'</button></div>';
return '<div class="fr"><div style="flex:1"><b>Cloud Save</b><div class="s" id="cs">'+cst+'</div>'+(USER?'<div class="s" style="text-transform:none">'+esc(USER.email||'')+'</div>':'')+'</div>'+(USER?'<button class="sm alt" onclick="cloudPush()">SYNC NOW</button><button class="sm danger" onclick="S.reg=0;S.googleLinked=0;lsave();AU.signOut();loginScr()">LOGOUT</button>':'<button class="sm" onclick="gLogin()">SIGN IN WITH GOOGLE</button>')+'</div>'+pwaRow+
'<div class="fr"><div style="flex:1"><b>Daily Wallpaper</b><div class="s">New background every day</div></div><select onchange="S.wp=this.value;save();toast(\'Applying...\');setTimeout(()=>location.reload(),700)" style="width:auto">'+o('default','Classic photo')+o('nasa','NASA space photo')+o('wiki','Wikipedia photo of the day')+'</select></div>'}

/* ---------- 3D LOBBY ENGINE (UP TO 5-PLAYER CODM SQUAD FORMATION) ---------- */
let R,SC,CAM,SOL,SOL_AVS=[],PR,RG,BGM,PS,tx=0,drag=0,gx=0,gy=0,rocks=[],M={},liveFps=60,fCnt=0,fT=0;
const GLTF_CACHE={soldier:null};
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.75,metalness:.2,flatShading:true})}
function applyGfx(){if(!R)return;const q=S.cfg.gfx||'High';const pr=q==='Low'?.75:q==='Medium'?1:q==='Ultra'?Math.min(devicePixelRatio,2.5):Math.min(devicePixelRatio,1.75);R.setPixelRatio(pr);if(PS)PS.visible=q!=='Low';if(SC&&SC.fog)SC.fog.far=q==='Low'?14:22}

function updateLobbySquad(){
  if(!R||!SOL||!SOL_AVS.length)return;
  const sq=squadMembers();
  /* 5-Player CODM V-Formation on the Lobby Platform */
  const slots=sq.length===1
    ?[[0,0,0,0]]
    :[[0,0,.35,0],[-.92,0,-.1,.12],[.92,0,-.1,-.12],[-1.72,0,-.55,.22],[1.72,0,-.55,-.22]];

  SOL_AVS.forEach((av,i)=>{
    const m=sq[i];
    if(m){
      av.grp.visible=true;
      const p=slots[i]||[0,0,0,0];
      av.grp.position.set(p[0],p[1],p[2]);
      av.grp.rotation.y=Math.PI+p[3];
      const gid=m.eq&&m.eq.gun>=0?m.eq.gun:3;
      av.setGun(gid);
    }else{
      av.grp.visible=false;
    }
  });
}

function look(){
  if(!R)return;
  if(RG)RG.material.color.set(S.eq.skin>=0?RAR[ITEMS[S.eq.skin].r].c:0xf5d300);
  updateLobbySquad();
}

function initGL(bgU,solU){if(typeof THREE==='undefined')return;try{
R=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),alpha:true,antialias:S.cfg.gfx!=='Low'});applyGfx();
SC=new THREE.Scene();SC.fog=new THREE.Fog(0x141c38,7,20);if(bgU)new THREE.TextureLoader().load(bgU,t=>{const g=new THREE.SphereGeometry(40,48,32);g.scale(-1,1,1);BGM=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:t,fog:false,color:0x7f8fc0}));SC.add(BGM)});CAM=new THREE.PerspectiveCamera(35,1,.1,50);CAM.position.set(0,1.65,8.9);CAM.lookAt(0,1.3,0);
SC.add(new THREE.HemisphereLight(0x9bb0ff,0x251038,1.15));const d=new THREE.DirectionalLight(0xffffff,1.15);d.position.set(3,4,5);SC.add(d);const r=new THREE.DirectionalLight(0xa050ff,1.3);r.position.set(-4,2,-3);SC.add(r);
SOL=new THREE.Group();SC.add(SOL);
const pl=new THREE.Mesh(new THREE.CylinderGeometry(2.55,2.8,.2,10),mat(0x1d2748));pl.position.y=-.1;SOL.add(pl);
const ring=new THREE.Mesh(new THREE.TorusGeometry(2.55,.04,6,10),new THREE.MeshBasicMaterial({color:0xf5d300}));RG=ring;ring.rotation.x=Math.PI/2;ring.position.y=.02;SOL.add(ring);

function spawnLobbyAvatars(){
  SOL_AVS.forEach(av=>SOL.remove(av.grp));
  SOL_AVS=[];
  const tints=[null,0x38bdf8,0x4ade80,0xc084fc,0xfb923c];
  for(let i=0;i<5;i++){
    const av=makeSoldierAvatar({armorCol:i===0?0x2e64b8:0x1e40af,gunId:S.eq.gun>=0?S.eq.gun:3,tint:tints[i]});
    av.grp.visible=i===0;
    SOL.add(av.grp);
    SOL_AVS.push(av);
  }
  look();
}
spawnLobbyAvatars();

if(solU&&THREE.GLTFLoader)new THREE.GLTFLoader().load(solU,g=>{GLTF_CACHE.soldier=g;spawnLobbyAvatars()},undefined,e=>console.warn('soldier model failed',e));

const rm=new THREE.MeshStandardMaterial({color:0x2a3566,flatShading:true,roughness:1});
for(let i=0;i<9;i++){const k=new THREE.Mesh(new THREE.IcosahedronGeometry(.5+Math.random()*1.3,0),rm);k.position.set(-9+Math.random()*18,-1+Math.random()*5,-3-Math.random()*8);SC.add(k);rocks.push(k)}
const pt=new Float32Array(300);for(let i=0;i<300;i++)pt[i]=(Math.random()-.5)*(i%3==1?8:20);const pg2=new THREE.BufferGeometry();pg2.setAttribute('position',new THREE.BufferAttribute(pt,3));PS=new THREE.Points(pg2,new THREE.PointsMaterial({color:0xbcd0ff,size:.05}));PS.position.z=-2;SC.add(PS);

let lx=null;
addEventListener('pointerdown',e=>{if(AR||e.button===2||e.target.closest('button,input,select,textarea,.pg>.pb:not(.x),.team-hud'))return;lx=normPt(e.clientX,e.clientY).x});
addEventListener('pointermove',e=>{if(!AR&&lx!==null){const x=normPt(e.clientX,e.clientY).x,sens=(S.cfg.sens||100)/100;drag+=(x-lx)*.012*sens;lx=x}});
addEventListener('pointerup',()=>lx=null);
addEventListener('deviceorientation',e=>{if(S.cfg.gyro&&e.gamma!=null){gx=Math.max(-25,Math.min(25,e.gamma))*.015;gy=Math.max(-25,Math.min(25,(e.beta||45)-45))*.008}});
function rs(){const w=isPortrait()?innerHeight:innerWidth,h=isPortrait()?innerWidth:innerHeight;R.setSize(w,h);CAM.aspect=w/h;CAM.updateProjectionMatrix()}rs();addEventListener('resize',rs);
const ck=new THREE.Clock();let lastDraw=0;
(function an(t){
  requestAnimationFrame(an);
  if(AR)return;
  const fpsCap=S.cfg.fps||60,minInt=1000/fpsCap;
  if(t-lastDraw<minInt-1)return;
  lastDraw=t;fCnt++;if(t-fT>=1000){liveFps=fCnt;fCnt=0;fT=t}
  const sec=t*.001,dt=ck.getDelta();
  SOL_AVS.forEach(av=>{if(av.grp.visible&&av.mix)av.mix.update(dt)});
  if(BGM)BGM.rotation.y=sec*.012;
  CAM.position.x=(S.cfg.rot?Math.sin(sec*.2)*.35:0)+gx;CAM.position.y=1.65-gy;CAM.lookAt(0,1.3,0);
  SOL.position.y=Math.sin(sec*1.6)*.03;SOL.position.x+=(tx-SOL.position.x)*.08;drag*=.985;
  SOL.rotation.y=-.12+(S.cfg.rot?Math.sin(sec*.4)*.08:0)+drag;
  rocks.forEach((k,i)=>{k.rotation.x=sec*.1*(i%3+1);k.rotation.y=sec*.08;k.position.y+=Math.sin(sec+i)*.0015});
  PS.rotation.y=sec*.02;R.render(SC,CAM);
})(0)}catch(e){console.warn('3D unavailable',e)}}

const BGS=['assets/bg.jpg','https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/2294472375_24a3b8ef46_o.jpg'];
const SOLS=['assets/soldier.glb','https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/models/gltf/Soldier.glb'];
const TIPS=['Up to 5 players can join your Home Lobby! Teammates tap READY so Leader can tap START!','Use the Top-Left Mic (🎤) & Speaker (🔊) buttons in Home & 3D World!','Right-click in 3D Battle Arena (or tap 🎯) to Scope / ADS in!','Equip Sniper, AR, SMG, or Launcher in Loadout to hold distinct 3D weapons'],wait=ms=>new Promise(r=>setTimeout(r,ms));
async function grab(urls){for(const u of urls){try{let r=window.caches?await caches.match(u):null;if(!r){r=await fetch(u);if(!r.ok)continue;if(window.caches)try{(await caches.open('lul1')).put(u,r.clone())}catch(e){}}const b=await r.blob();return{u:URL.createObjectURL(b),mb:b.size/1048576}}catch(e){}}return null}
function loginScr(){inLogin=1;ui.innerHTML='<div class="scr"><div class="logo">LEVEL UP <b>LIFE OPS</b></div><div class="s" style="margin:.3rem 0 1.1rem">One-Time Sign In · Enter your callsign & link Google once to play</div><div style="width:min(320px,72vw)"><input id="ln" maxlength="16" placeholder="Enter your callsign" value="'+(S.name!=='Player'?esc(S.name):'')+'"><button class="sm" style="width:100%;margin-top:8px;padding:.7rem" onclick="gLogin()">SIGN IN WITH GOOGLE (ONE-TIME LOGIN)</button><button class="sm alt" style="width:100%;margin-top:6px;padding:.6rem" onclick="doLogin()">PLAY AS GUEST (LOCAL DEVICE)</button><button class="sm alt" style="width:100%;margin-top:6px" onclick="impLogin()">LOAD BACKUP</button></div><div class="s" style="position:absolute;bottom:.6rem">Your login is remembered automatically across sessions</div></div>'}
function doLogin(){const v=document.getElementById('ln').value.trim();if(!v)return toast('Enter a callsign');S.name=v.slice(0,16);S.reg=1;save();loading()}
function impLogin(){const t=prompt('Paste your backup text');if(!t)return;try{const o=JSON.parse(t);if(!o.quests)throw 0;S=Object.assign(fresh(),o,{reg:1});if(!S.createdAt)S.createdAt=Date.now();S.cfg=Object.assign(defCfg(),S.cfg||{});S.cfg.hud=Object.assign(defHud(),S.cfg.hud||{});save();loading()}catch(e){toast('Invalid backup')}}
async function loading(){if(busy)return;busy=1;inLogin=0;SFX.preload();ui.innerHTML='<div class="scr" id="sc"><div class="logo">LEVEL UP <b>LIFE OPS</b></div><div class="lbar"><div class="s" id="lt"></div><div class="bar" style="width:100%;height:.6rem"><i id="lb" style="width:0"></i></div><div class="s" id="tp" style="margin-top:6px"></div></div></div>';
const sc=document.getElementById('sc'),lb=document.getElementById('lb'),lt=document.getElementById('lt');document.getElementById('tp').textContent='TIP: '+pick(TIPS);
const tot=ITEMS.length+4;let n=0,mb=0;const st=t=>{n++;lb.style.width=Math.round(n/tot*100)+'%';lt.textContent=t+' · '+mb.toFixed(1)+' MB downloaded'};
lt.textContent='Connecting to server...';await wait(250);await syncClock();
const bg=await grab(BGS);if(bg){mb+=bg.mb;sc.style.backgroundImage='url('+bg.u+')'}st('Downloading environment');
const sd=await grab(SOLS);if(sd)mb+=sd.mb;st('Downloading 3D tactical soldiers');
await Promise.all(ITEMS.map(it=>new Promise(r=>{const i=new Image();i.onload=i.onerror=()=>{st('Downloading armory icons');r()};i.src=iconUrl(it)})));
const wu=await wallpaper();if(wu)document.getElementById('wp').style.backgroundImage='url("'+wu+'")';st('Fetching daily wallpaper');st('Starting 3D engine');initGL(wu?null:bg&&bg.u,sd&&sd.u);await wait(450);busy=0;pg='';render();if(S.cfg&&S.cfg.bgm)SFX.setAmb(true)}
load();cloudInit();if(S.reg)loading();else loginScr();
setInterval(()=>{const n=now(),c=document.getElementById('clk');if(c){const e=new Date(n);e.setHours(24,0,0,0);const s=Math.max(0,Math.floor((e-n)/1000));const fpsTxt=S.cfg&&S.cfg.showFps?' · '+liveFps+' FPS':'';c.textContent='🕒 '+n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' · RESET '+[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')+fpsTxt}const ph=document.getElementById('prof-hrs');if(ph)ph.textContent=accountHours();if(!lastDay)lastDay=today();else if(today()!==lastDay){lastDay=today();render()}},1000);
function tod(){const m=S.cfg&&S.cfg.tod||'auto',h=now().getHours(),e=document.getElementById('tod');if(e)e.style.opacity=m==='night'?.48:m==='day'?0:h>=19||h<5?.45:h>=17||h<7?.18:0}tod();setInterval(tod,60000);
setInterval(()=>{ci++;const t=document.getElementById('tk');if(t)t.textContent=CHAT[ci%CHAT.length]},4000);
