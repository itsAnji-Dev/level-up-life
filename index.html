/* ===== REAL GAME AUDIO ENGINE (Google Sound Library + Web Audio Fallback) ===== */
const SFX=(()=>{
  const G='https://actions.google.com/sounds/v1/';
  const LIB={
    click:[G+'weapons/rifle_fire_select.ogg'],
    back:[G+'tools/ejecting_a_cassette.ogg'],
    coin:[G+'weapons/shell_casings_revolver.ogg'],

    gunM:[G+'science_fiction/sci_fi_vortex.ogg',G+'weapons/cocking_a_50cal_gun.ogg'],
    shake:[G+'science_fiction/suspense_builder.ogg'],
    lootC:[G+'weapons/gun_powder_ignite.ogg',G+'weapons/gun_parts_handling.ogg'],
    lootR:[G+'weapons/gun_reload.ogg',G+'weapons/rifle_charging_handle.ogg'],
    lootE:[G+'science_fiction/sci_fi_vortex.ogg',G+'weapons/shot_gun_handling.ogg'],

    congrats:[G+'alarms/bugle_tune.ogg',G+'alarms/medium_bell_ringing_near.ogg']
  };
  const pool={};let ctx=null,amb=null;
  const cfg=()=>S&&S.cfg?S.cfg:{sfx:1,vol:85,bgm:0,vib:1};
  const volScale=()=>Math.max(0,Math.min(1,(cfg().vol??85)/100));
  function vib(ms){try{if(cfg().vib&&navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
  function synth(f1,f2,dur,type='triangle',vol=.14,delay=0){
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    if(!ctx)ctx=new A();if(ctx.state==='suspended')ctx.resume();

  function quest(){vib([25,30,55]);clip(LIB.congrats,.8,2400,()=>{[523.25,659.25,783.99,1046.5].forEach((f,i)=>synth(f,f*1.01,.18,'triangle',.14,i*.065))})}

/* ===== FOCUS TIMER WITH SCREEN WAKE LOCK ===== */
async function reqWake(){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function relWake(){try{if(wakeLock){wakeLock.release();wakeLock=null}}catch(e){}}
function startFocus(mins,qid=null,title='Deep Focus Session'){
  if(focusInt)clearInterval(focusInt);
  const tot=Math.max(10,Math.round(mins*60));
  focusState={rem:tot,tot,mins,qid,title};
  reqWake();renderFocus();
  focusInt=setInterval(()=>{
    if(!focusState)return;
    focusState.rem--;
    if(focusState.rem<=0){
      clearInterval(focusInt);focusInt=null;relWake();
      const doneState=focusState;focusState=null;
      S.focusMins=(S.focusMins||0)+doneState.mins;
      const earnedCp=Math.max(10,Math.round(doneState.mins*0.8))+(S.map==='shipment'?5:0);
      if(doneState.qid){doQuest(doneState.qid,earnedCp)}
      else{S.cp+=earnedCp;S.coins+=doneState.mins*2;SFX.lvlup();addXP(doneState.mins*3);toast('FOCUS COMPLETE! +'+earnedCp+' 💎 CP · +'+(doneState.mins*2)+' 🪙');save();render()}
      const el=document.getElementById('fscr');if(el)el.remove();
    }else renderFocus();
  },1000);
}
function stopFocus(){if(confirm('Abort focus session? You will forfeit the CP reward.')){clearInterval(focusInt);focusInt=null;focusState=null;relWake();const el=document.getElementById('fscr');if(el)el.remove();toast('Focus session aborted')}}
function renderFocus(){
  if(!focusState)return;
  let el=document.getElementById('fscr');
  if(!el){el=document.createElement('div');el.id='fscr';el.className='fscr';document.body.appendChild(el)}
  const m=String(Math.floor(focusState.rem/60)).padStart(2,'0'),s=String(focusState.rem%60).padStart(2,'0');
  const pct=Math.round((1-focusState.rem/focusState.tot)*100);
  el.innerHTML='<div class="s" style="color:var(--y)">🔒 SCREEN WAKE LOCK ACTIVE · MAP: '+esc(activeMap().name)+'</div><h2 style="margin-top:6px">'+esc(focusState.title)+'</h2><div class="ftm">'+m+':'+s+'</div><div class="bar" style="width:min(340px,75vw);height:.6rem"><i style="width:'+pct+'%"></i></div><p class="s" style="margin:10px 0 18px">Stay locked in until 00:00 to claim XP, Credits & high-level CP (💎)</p><button class="sm danger" onclick="stopFocus()">ABORT MISSION</button>';
}

function selectMap(id){
  const m=MAPS.find(x=>x.id===id);if(!m)return;
  if(!S.umaps[id]){
    if(S.lvl<m.unlock)return toast('Requires Level '+m.unlock);
    if(S.coins<m.cost)return toast('Need '+m.cost+' 🪙 to unlock '+m.name);
    S.coins-=m.cost;S.umaps[id]=1;SFX.coin();toast('Unlocked Map: '+m.name+'!');
  }
  S.map=id;save();render();setTimeout(drawMapRadar,20);
}
function drawMapRadar(){
  const cv=document.getElementById('mcv');if(!cv)return;
  const ctx=cv.getContext('2d'),w=cv.width=cv.offsetWidth||320,h=cv.height=175;
  ctx.fillStyle='#060c1a';ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#1b3664';ctx.lineWidth=1;
  for(let x=0;x<w;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
  for(let y=0;y<h;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
  /* Tactical buildings & lanes */
  ctx.fillStyle='#243b6b';ctx.strokeStyle='#4aa8ff';
  const seedN=S.map.length*17;
  [[45,35,55,35],[w-105,35,60,38],[w/2-35,h/2-22,70,44],[50,h-70,50,35],[w-100,h-70,55,35]].forEach((b,i)=>{
    const ox=((seedN*(i+1))%16)-8;ctx.fillRect(b[0]+ox,b[1],b[2],b[3]);ctx.strokeRect(b[0]+ox,b[1],b[2],b[3]);
  });
  /* Objectives A, B, C & Spawns */
  const pts=[['A',75,h/2,'#4aa8ff'],['B',w/2,h/2,'#f5d300'],['C',w-75,h/2,'#ff2a55']];
  ctx.font='bold 11px sans-serif';ctx.textAlign='center';
  pts.forEach(p=>{ctx.fillStyle=p[3];ctx.beginPath();ctx.arc(p[1],p[2],10,0,6.28);ctx.fill();ctx.fillStyle='#000';ctx.fillText(p[0],p[1],p[2]+4)});
  ctx.fillStyle='#5be58a';ctx.fillText('SPAWN 1',36,20);ctx.fillStyle='#ff5c7c';ctx.fillText('SPAWN 2',w-40,h-10);
}

function doLogin(){const v=document.getElementById('ln').value.trim();if(!v)return toast('Enter a callsign');S.name=v.slice(0,16);S.reg=1;save();loading()}
function impLogin(){const t=prompt('Paste your backup text');if(!t)return;try{const o=JSON.parse(t);if(!o.quests)throw 0;S=Object.assign(fresh(),o,{reg:1});S.cfg=Object.assign(defCfg(),S.cfg||{});save();loading()}catch(e){toast('Invalid backup')}}
async function loading(){busy=1;inLogin=0;SFX.preload();ui.innerHTML='<div class="scr" id="sc"><div class="logo">LEVEL UP <b>LIFE OPS</b></div><div class="lbar"><div class="s" id="lt"></div><div class="bar" style="width:100%;height:.6rem"><i id="lb" style="width:0"></i></div><div class="s" id="tp" style="margin-top:6px"></div></div></div>';
const sc=document.getElementById('sc'),lb=document.getElementById('lb'),lt=document.getElementById('lt');document.getElementById('tp').textContent='TIP: '+pick(TIPS);
const tot=ITEMS.length+4;let n=0,mb=0;const st=t=>{n++;lb.style.width=Math.round(n/tot*100)+'%';lt.textContent=t+' · '+mb.toFixed(1)+' MB downloaded'};
lt.textContent='Connecting to server...';await wait(250);await syncClock();
const bg=await grab(BGS);if(bg){mb+=bg.mb;sc.style.backgroundImage='url('+bg.u+')'}st('Downloading environment');
const sd=await grab(SOLS);if(sd)mb+=sd.mb;st('Downloading 3D models');
await Promise.all(ITEMS.map(it=>new Promise(r=>{const i=new Image();i.onload=i.onerror=()=>{st('Downloading armory icons');r()};i.src=iconUrl(it)})));
const wu=await wallpaper();if(wu)document.getElementById('wp').style.backgroundImage='url("'+wu+'")';st('Fetching daily wallpaper');st('Starting engine');initGL(wu?null:bg&&bg.u,sd&&sd.u);await wait(450);busy=0;pg='';render();if(S.cfg&&S.cfg.bgm)SFX.setAmb(true)}
load();cloudInit();if(S.reg)loading();else loginScr();
setInterval(()=>{const n=now(),c=document.getElementById('clk');if(c){const e=new Date(n);e.setHours(24,0,0,0);const s=Math.max(0,Math.floor((e-n)/1000));const fpsTxt=S.cfg&&S.cfg.showFps?' · '+liveFps+' FPS':'';c.textContent='🕒 '+n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' · RESET '+[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')+fpsTxt}if(!lastDay)lastDay=today();else if(today()!==lastDay){lastDay=today();render()}},1000);
function tod(){const m=S.cfg&&S.cfg.tod||'auto',h=now().getHours(),e=document.getElementById('tod');if(e)e.style.opacity=m==='night'?.48:m==='day'?0:h>=19||h<5?.45:h>=17||h<7?.18:0}tod();setInterval(tod,60000);
setInterval(()=>{ci++;const t=document.getElementById('tk');if(t)t.textContent=CHAT[ci%CHAT.length]},4000);
</script></body></html>
