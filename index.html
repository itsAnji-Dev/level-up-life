/* ===== REAL GAME AUDIO ENGINE ===== */
const SFX=(()=>{
  const G='https://actions.google.com/sounds/v1/';
  const LIB={
    click:[G+'weapons/rifle_fire_select.ogg'],
    back:[G+'tools/ejecting_a_cassette.ogg'],
    coin:[G+'weapons/shell_casings_revolver.ogg'],
    shot:[G+'weapons/gun_powder_ignite.ogg',G+'weapons/rifle_fire_select.ogg'],
    reload:[G+'weapons/gun_reload.ogg'],
    boom:[G+'weapons/explosion_large.ogg'],
    gunC:[G+'weapons/gun_parts_handling.ogg'],
    gunR:[G+'weapons/rifle_charging_handle.ogg'],
    gunE:[G+'weapons/shot_gun_handling.ogg'],
    gunL:[G+'weapons/cocking_a_50cal_gun.ogg'],
    gunM:[G+'science_fiction/sci_fi_vortex.ogg',G+'weapons/cocking_a_50cal_gun.ogg'],
    shake:[G+'science_fiction/suspense_builder.ogg'],
    lootC:[G+'weapons/gun_powder_ignite.ogg',G+'weapons/gun_parts_handling.ogg'],
    lootR:[G+'weapons/gun_reload.ogg',G+'weapons/rifle_charging_handle.ogg'],
    lootE:[G+'science_fiction/sci_fi_vortex.ogg',G+'weapons/shot_gun_handling.ogg'],
    cheer:[G+'crowd/applause.ogg']
  };
  const pool={};let ctx=null,amb=null;
  const cfg=()=>S&&S.cfg?S.cfg:{sfx:1,vol:85,bgm:0,vib:1};
  const volScale=()=>Math.max(0,Math.min(1,(cfg().vol??85)/100));
  function getCtx(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;if(!ctx)ctx=new A();if(ctx.state==='suspended')ctx.resume();return ctx}
  function vib(ms){try{if(cfg().vib&&navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
  function synth(f1,f2,dur,type='triangle',vol=.14,delay=0){
    const c=getCtx();if(!c)return;
    const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f1,t);
    if(f2&&f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    const v=vol*volScale();
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);
  }
  function brassFanfare(grand=0){
    if(!cfg().sfx||volScale()<=0)return;
    const c=getCtx();if(!c)return;
    const chords=grand?[[130.81,196,261.63,329.63],[146.83,220,293.66,369.99],[164.81,246.94,329.63,415.30],[196,293.66,392,493.88,587.33]]:[[130.81,196,261.63],[164.81,246.94,329.63],[196,293.66,392,493.88]];
    const step=grand?.22:.17;
    chords.forEach((notes,idx)=>{
      const dur=idx===chords.length-1?(grand?.95:.65):step*.95;
      const t0=c.currentTime+idx*step;
      notes.forEach(freq=>{
        const o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();
        o.type='sawtooth';o.frequency.setValueAtTime(freq,t0);
        f.type='lowpass';f.frequency.setValueAtTime(650,t0);f.frequency.exponentialRampToValueAtTime(1450,t0+dur*.6);
        const v=(grand?.085:.07)*volScale();
        g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(v,t0+.035);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
        o.connect(f);f.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+.03);
      });
    });
  }
  function clip(urls,vol=.8,maxMs=2800,fb=null){
    if(!cfg().sfx||volScale()<=0)return;
    const u=Array.isArray(urls)?urls[Math.floor(Math.random()*urls.length)]:urls;
    try{
      if(!pool[u]){pool[u]=new Audio(u);pool[u].preload='auto'}
      const a=pool[u].cloneNode();a.volume=Math.min(1,vol*volScale());
      const p=a.play();if(p&&p.catch)p.catch(()=>{if(fb)fb()});
      if(maxMs)setTimeout(()=>{try{a.pause();a.currentTime=0}catch(e){}},maxMs);
    }catch(e){if(fb)fb()}
  }
  function preload(){Object.values(LIB).flat().forEach(u=>{if(!pool[u]){pool[u]=new Audio(u);pool[u].preload='auto'}})}
  function click(){vib(12);clip(LIB.click,.55,400,()=>synth(540,260,.05,'triangle',.1))}
  function back(){vib(10);clip(LIB.back,.65,600,()=>synth(380,200,.06,'sine',.1))}
  function coin(){vib(20);clip(LIB.coin,.8,1100,()=>synth(660,990,.12,'triangle',.12))}
  function shot(){vib(15);clip(LIB.shot,.8,500,()=>synth(180,55,.09,'sawtooth',.16))}
  function reload(){vib([15,40,20]);clip(LIB.reload,.85,1500,()=>synth(260,420,.14,'triangle',.12))}
  function boom(){vib([60,30,90]);clip(LIB.boom,.95,2200,()=>synth(120,28,.45,'sawtooth',.22))}
  function equip(type,r){
    vib([20,30,30]);
    if(type==='gun')clip(LIB['gun'+(r||'C')]||LIB.gunC,.9,1800,()=>synth(220,440,.15,'sawtooth',.14));
    else clip(LIB.gunR,.75,1200,()=>synth(440,660,.12,'triangle',.12));
  }
  function quest(){vib([25,30,55]);brassFanfare(0);clip(LIB.cheer,.45,2200)}
  function lvlup(){vib([40,40,40,40,100]);brassFanfare(1);clip(LIB.cheer,.75,3200)}
  function shake(){vib([25,45,25,45,35,45,50]);clip(LIB.shake,.85,1150,()=>{for(let i=0;i<7;i++)synth(110+i*22,85,.08,'square',.08,i*.13)})}
  function loot(r){
    if(r==='M'||r==='L'){vib([60,40,60,40,150]);brassFanfare(1);clip(LIB.cheer,.7,3000)}
    else if(r==='E'){vib([45,35,90]);clip(LIB.lootE,.9,2400,()=>brassFanfare(0))}
    else if(r==='R'){vib([30,30,60]);clip(LIB.lootR,.85,1800,()=>brassFanfare(0))}
    else{vib(35);clip(LIB.lootC,.8,1500,()=>synth(280,420,.18,'triangle',.12))}
  }
  function deploy(){vib([30,40,60]);clip(LIB.gunL,.9,1600,()=>synth(220,440,.2,'sawtooth',.15))}
  function setAmb(on){
    if(!on){if(amb){try{amb.stop()}catch(e){}amb=null}return}
    const c=getCtx();if(!c||amb)return;
    const o1=c.createOscillator(),o2=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();
    o1.type='sawtooth';o1.frequency.value=55;o2.type='triangle';o2.frequency.value=82.41;
    f.type='lowpass';f.frequency.value=160;g.gain.value=.035;
    o1.connect(f);o2.connect(f);f.connect(g);g.connect(c.destination);
    o1.start();o2.start();amb={stop(){o1.stop();o2.stop()}};
  }
  return{preload,click,back,coin,shot,reload,boom,equip,quest,lvlup,shake,loot,deploy,setAmb,vib};
})();

function accountHours(){
  const msElapsed=Math.max(0,Date.now()-(S.createdAt||Date.now()));
  const hrs=msElapsed/3600000;
  if(hrs<1){const mins=Math.floor(msElapsed/60000);return hrs.toFixed(2)+'h ('+mins+'m)'}
  return hrs.toFixed(1)+' hrs';
}

function doQuest(id,bonusCp=0){
  const q=S.quests.find(x=>x.id===id),t=today();if(!q||q.done===t||q.done==='forever')return;
  const [xp,co,cp]=DIFF[q.d]||[40,20,5];
  q.done=q.d==='Boss'?'forever':t;
  if(S.last!==t){S.streak=S.last===yest()?S.streak+1:1;S.last=t}
  if(S.tcount.d!==t)S.tcount={d:t,n:0};S.tcount.n++;S.total=(S.total||0)+1;
  const sb=Math.min(S.streak,7)*2,totCo=co+sb,totCp=cp+bonusCp;
  S.coins+=totCo;S.cp+=totCp;
  let m='+'+xp+' XP · +'+totCo+' 🪙'+(totCp?' · +'+totCp+' 💎 CP':'');
  const r=Math.random();let k=r<.6?1:0;if(r>.9)k=3;if(q.d==='Boss')k+=2;
  S.keys+=k;if(k)m+=' · +'+k+' 🗝️'+(k===3?' JACKPOT!':'');
  SFX.quest();addXP(xp);toast(m);save();render();

/* ===== FOCUS TIMER WITH SCREEN WAKE LOCK ===== */
async function reqWake(){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function relWake(){try{if(wakeLock){wakeLock.release();wakeLock=null}}catch(e){}}
function startFocus(mins,qid=null,title='Deep Focus Session'){
  if(focusInt)clearInterval(focusInt);
  const tot=Math.max(10,Math.round(mins*60));
  focusState={rem:tot,tot,mins,qid,title};
  reqWake();renderFocus();
  focusInt=setInterval(()=>{
    if(!focusState)return;
    focusState.rem--;
    if(focusState.rem<=0){
      clearInterval(focusInt);focusInt=null;relWake();
      const doneState=focusState;focusState=null;
      S.focusMins=(S.focusMins||0)+doneState.mins;
      const earnedCp=Math.max(10,Math.round(doneState.mins*0.8));
      if(doneState.qid){doQuest(doneState.qid,earnedCp)}
      else{S.cp+=earnedCp;S.coins+=doneState.mins*2;SFX.lvlup();addXP(doneState.mins*3);toast('FOCUS COMPLETE! +'+earnedCp+' 💎 CP · +'+(doneState.mins*2)+' 🪙');save();render()}
      const el=document.getElementById('fscr');if(el)el.remove();
    }else renderFocus();
  },1000);
}
function stopFocus(){if(confirm('Abort focus session? You will forfeit the CP reward.')){clearInterval(focusInt);focusInt=null;focusState=null;relWake();const el=document.getElementById('fscr');if(el)el.remove();toast('Focus session aborted')}}
function renderFocus(){
  if(!focusState)return;
  let el=document.getElementById('fscr');
  if(!el){el=document.createElement('div');el.id='fscr';el.className='fscr';document.body.appendChild(el)}
  const m=String(Math.floor(focusState.rem/60)).padStart(2,'0'),s=String(focusState.rem%60).padStart(2,'0');
  const pct=Math.round((1-focusState.rem/focusState.tot)*100);
  el.innerHTML='<div class="s" style="color:var(--y)">🔒 SCREEN WAKE LOCK ACTIVE</div><h2 style="margin-top:6px">'+esc(focusState.title)+'</h2><div class="ftm">'+m+':'+s+'</div><div class="bar" style="width:min(340px,75vw);height:.6rem"><i style="width:'+pct+'%"></i></div><p class="s" style="margin:10px 0 18px">Stay locked in until 00:00 to claim XP, Credits & CP (💎)</p><button class="sm danger" onclick="stopFocus()">ABORT SESSION</button>';
}

function selectMap(id){

  }

function drawMapRadar(){
  const cv=document.getElementById('mcv');if(!cv)return;
  const ctx=cv.getContext('2d'),w=cv.width=cv.offsetWidth||320,h=cv.height=165;
  ctx.fillStyle='#060c1a';ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#1b3664';ctx.lineWidth=1;
  for(let x=0;x<w;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
  for(let y=0;y<h;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
  ctx.fillStyle='#334155';ctx.fillRect(w/2-14,0,28,h);ctx.fillRect(0,h/2-12,w,24);
  ctx.fillStyle='#243b6b';ctx.strokeStyle='#4aa8ff';
  [[w/2-75,24,46,32],[w/2+30,24,46,32],[w/2-75,h-56,46,32],[w/2+30,h-56,46,32]].forEach(b=>{
    ctx.fillRect(b[0],b[1],b[2],b[3]);ctx.strokeRect(b[0],b[1],b[2],b[3]);
  });
  ctx.font='bold 10px sans-serif';ctx.textAlign='center';
  ctx.fillStyle='#5be58a';ctx.fillText('5-PLAYER SQUAD SPAWN',w/2,h-14);
  ctx.fillStyle='#ff2a55';ctx.fillText('6 3D SOLDIER BOTS',w/2,16);
}

let AU=null,DB=null,USER=null,cst='Local only',tmr=null,unsub=null,busy=0,inLogin=0,lastDay='';
const TO=()=>({signal:AbortSignal.timeout?AbortSignal.timeout(5000):undefined});
function cloudInit(){if(!FB_CONFIG.apiKey||typeof firebase==='undefined')return;try{firebase.initializeApp(FB_CONFIG);AU=firebase.auth();DB=firebase.firestore();
AU.getRedirectResult().catch(e=>{if(e&&e.code)toast('Login failed: '+esc(e.code))});

async function cloudLoad(){try{await syncClock();const d=await DB.collection('saves').doc(USER.uid).get();
if(d.exists){const c=JSON.parse(d.data().data);if((c.rev||0)>(S.rev||0)){if((S.total||0)>0&&!confirm('Cloud save found: Level '+c.lvl+'. OK = use cloud progress. Cancel = keep THIS device and overwrite cloud.')){await cloudPush();cst='Synced ✓'}else{S=Object.assign(fresh(),c,{reg:1});if(!S.createdAt)S.createdAt=Date.now();if(typeof S.cp!=='number')S.cp=150;if(typeof S.wins!=='number')S.wins=0;S.cfg=Object.assign(defCfg(),S.cfg||{});S.cfg.hud=Object.assign(defHud(),S.cfg.hud||{});lsave();look();toast('Cloud progress loaded ☁️')}}else{S.reg=1;lsave();await cloudPush()}}
else{if(!S.reg){S.name=(USER.displayName||'Player').split(' ')[0].slice(0,16);S.reg=1}lsave();await cloudPush()}
cst='Synced ✓';listenFriends();if(inLogin&&S.reg){inLogin=0;loading()}}catch(e){cst='Sync failed';console.warn(e);toast('Cloud error. Check Firestore rules.')}}
async function cloudPush(){if(!DB||!USER)return;try{cst='Saving...';upd();const b=DB.batch(),T=firebase.firestore.FieldValue.serverTimestamp();
b.set(DB.collection('saves').doc(USER.uid),{data:JSON.stringify(S),rev:S.rev||0,dev:navigator.userAgent.slice(0,90),t:T});
b.set(DB.collection('players').doc(USER.uid),{pid:S.id,n:S.name,l:S.lvl,c:Object.keys(S.owned).length,s:S.streak,a:S.eq.char>=0?ITEMS[S.eq.char].ic:'🪖',eq:S.eq,map:S.map,outbox:OUTBOX.slice(-20),outboxTargets:[...new Set(OUTBOX.map(o=>o.toPid))],squadId:SQUAD_ID||null,squadReady:MY_READY?1:0,squadPing:Date.now(),t:T},{merge:true});
await b.commit();cst='Synced ✓'}catch(e){cst='Sync failed';console.warn(e)}upd()}
function cloudSoon(){if(!USER)return;clearTimeout(tmr);cst='Saving...';tmr=setTimeout(cloudPush,2500)}
function upd(){const e=document.getElementById('cs');if(e)e.textContent=cst}
async function syncClock(){try{let ms;if(USER&&DB){const r=DB.collection('players').doc(USER.uid);await r.set({ping:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});ms=(await r.get({source:'server'})).data().ping.toMillis()}else{ms=(await(await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC',TO())).json()).unixtime*1000}if(ms>0){OFF=ms-Date.now();try{localStorage.setItem('lul.off',OFF)}catch(e){}}}catch(e){}}
function listenFriends(){
  if(unsub)unsub();

    sn.forEach(d=>{
      const x=d.data();

    });
    lsave();
    if(!AR&&(pg===''||pg==='clan'))render();

}
async function wallpaper(){if(S.wp==='default')return null;const k='lul.wp.'+S.wp+'.'+today();try{const c=localStorage.getItem(k);if(c)return c}catch(e){}let u=null;
try{if(S.wp==='nasa'){const j=await(await fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY',TO())).json();u=j.media_type==='image'?j.url:null}
else{const d=now(),j=await(await fetch('https://en.wikipedia.org/api/rest_v1/feed/featured/'+d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'),TO())).json();u=j.image&&j.image.thumbnail?j.image.thumbnail.source.replace(/\/\d+px-/,'/1280px-'):null}}catch(e){}
if(u)try{localStorage.setItem(k,u)}catch(e){}return u}
function cloudTab(){const o=(v,t)=>'<option value="'+v+'"'+(S.wp===v?' selected':'')+'>'+t+'</option>';
const pwaRow=isStandalone()?'<div class="fr"><div style="flex:1"><b>Android App Mode</b><div class="s">Installed & offline-ready ✓</div></div></div>':'<div class="fr"><div style="flex:1"><b>Install App on Phone</b><div class="s">Full-screen landscape + offline play ($0)</div></div><button class="sm" onclick="installApp()">'+(PWA_PROMPT?'INSTALL NOW':'HOW TO INSTALL')+'</button></div>';
return '<div class="fr"><div style="flex:1"><b>Cloud Save</b><div class="s" id="cs">'+cst+'</div>'+(USER?'<div class="s" style="text-transform:none">'+esc(USER.email||'')+'</div>':'')+'</div>'+(USER?'<button class="sm alt" onclick="cloudPush()">SYNC NOW</button><button class="sm danger" onclick="AU.signOut()">LOGOUT</button>':'<button class="sm" onclick="gLogin()">SIGN IN WITH GOOGLE</button>')+'</div>'+pwaRow+
'<div class="fr"><div style="flex:1"><b>Daily Wallpaper</b><div class="s">New background every day</div></div><select onchange="S.wp=this.value;save();toast(\'Applying...\');setTimeout(()=>location.reload(),700)" style="width:auto">'+o('default','Classic photo')+o('nasa','NASA space photo')+o('wiki','Wikipedia photo of the day')+'</select></div>'}

/* ---------- 3D LOBBY ENGINE (5-SOLDIER V-FORMATION PLATFORM) ---------- */
let R,SC,CAM,SOL,LOBBY_AVS=[],PR,RG,BGM,PS,tx=0,drag=0,gx=0,gy=0,rocks=[],liveFps=60,fCnt=0,fT=0;
const GLTF_CACHE={soldier:null};
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.75,metalness:.2,flatShading:true})}
function applyGfx(){if(!R)return;const q=S.cfg.gfx||'High';const pr=q==='Low'?.75:q==='Medium'?1:q==='Ultra'?Math.min(devicePixelRatio,2.5):Math.min(devicePixelRatio,1.75);R.setPixelRatio(pr);if(PS)PS.visible=q!=='Low';if(SC&&SC.fog)SC.fog.far=q==='Low'?14:24}

const V_SLOTS=[
  {x:0,z:.45,rot:Math.PI},
  {x:-.98,z:.05,rot:Math.PI+.14},
  {x:.98,z:.05,rot:Math.PI-.14},
  {x:-1.85,z:-.45,rot:Math.PI+.26},
  {x:1.85,z:-.45,rot:Math.PI-.26}
];

function updateLobbySquad(){
  if(!R||!SOL||!LOBBY_AVS.length)return;
  const sq=squadMembers();
  LOBBY_AVS.forEach((av,idx)=>{
    const m=sq[idx];
    if(!m){av.grp.visible=false;return}
    av.grp.visible=true;
    const pos=sq.length===1?{x:0,z:0,rot:Math.PI}:V_SLOTS[idx];
    av.grp.position.set(pos.x,0,pos.z);
    av.grp.rotation.y=pos.rot;
    const gid=m.me?(S.eq.gun>=0?S.eq.gun:3):(m.eq&&m.eq.gun>=0?m.eq.gun:3);
    av.setGun(gid);
  });
}

function look(){
  if(!R)return;
  if(RG)RG.material.color.set(S.eq.skin>=0?RAR[ITEMS[S.eq.skin].r].c:0xf5d300);
  updateLobbySquad();
}

function initGL(bgU,solU){if(typeof THREE==='undefined')return;try{
R=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),alpha:true,antialias:S.cfg.gfx!=='Low'});applyGfx();
SC=new THREE.Scene();SC.fog=new THREE.Fog(0x141c38,8,22);if(bgU)new THREE.TextureLoader().load(bgU,t=>{const g=new THREE.SphereGeometry(40,48,32);g.scale(-1,1,1);BGM=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:t,fog:false,color:0x7f8fc0}));SC.add(BGM)});CAM=new THREE.PerspectiveCamera(36,1,.1,50);CAM.position.set(0,1.65,9.0);CAM.lookAt(0,1.3,0);
SC.add(new THREE.HemisphereLight(0x9bb0ff,0x251038,1.15));const d=new THREE.DirectionalLight(0xffffff,1.15);d.position.set(3,4,5);SC.add(d);const r=new THREE.DirectionalLight(0xa050ff,1.3);r.position.set(-4,2,-3);SC.add(r);
SOL=new THREE.Group();SC.add(SOL);
const pl=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.85,.22,10),mat(0x1d2748));pl.position.y=-.11;SOL.add(pl);
const ring=new THREE.Mesh(new THREE.TorusGeometry(2.6,.04,6,10),new THREE.MeshBasicMaterial({color:0xf5d300}));RG=ring;ring.rotation.x=Math.PI/2;ring.position.y=.02;SOL.add(ring);

function spawnLobbyAvatars(){
  LOBBY_AVS.forEach(a=>SOL.remove(a.grp));
  LOBBY_AVS=[];
  const tints=[null,0x38bdf8,0x4ade80,0xc084fc,0xfb923c];
  for(let i=0;i<5;i++){
    const av=makeSoldierAvatar({armorCol:i===0?0x2e64b8:0x38bdf8,gunId:3,tint:tints[i]});
    av.grp.visible=i===0;
    SOL.add(av.grp);
    LOBBY_AVS.push(av);
  }
  look();
}
spawnLobbyAvatars();

if(solU&&THREE.GLTFLoader)new THREE.GLTFLoader().load(solU,g=>{GLTF_CACHE.soldier=g;spawnLobbyAvatars()},undefined,e=>console.warn('soldier model failed',e));

const rm=new THREE.MeshStandardMaterial({color:0x2a3566,flatShading:true,roughness:1});
for(let i=0;i<9;i++){const k=new THREE.Mesh(new THREE.IcosahedronGeometry(.5+Math.random()*1.3,0),rm);k.position.set(-9+Math.random()*18,-1+Math.random()*5,-3-Math.random()*8);SC.add(k);rocks.push(k)}
const pt=new Float32Array(300);for(let i=0;i<300;i++)pt[i]=(Math.random()-.5)*(i%3==1?8:20);const pg2=new THREE.BufferGeometry();pg2.setAttribute('position',new THREE.BufferAttribute(pt,3));PS=new THREE.Points(pg2,new THREE.PointsMaterial({color:0xbcd0ff,size:.05}));PS.position.z=-2;SC.add(PS);

let lx=null;
addEventListener('pointerdown',e=>{if(AR||e.button===2||e.target.closest('button,input,select,textarea,.pg>.pb:not(.x),.sq-dock'))return;lx=normPt(e.clientX,e.clientY).x});
addEventListener('pointermove',e=>{if(!AR&&lx!==null){const x=normPt(e.clientX,e.clientY).x,sens=(S.cfg.sens||100)/100;drag+=(x-lx)*.012*sens;lx=x}});
addEventListener('pointerup',()=>lx=null);
addEventListener('deviceorientation',e=>{if(S.cfg.gyro&&e.gamma!=null){gx=Math.max(-25,Math.min(25,e.gamma))*.015;gy=Math.max(-25,Math.min(25,(e.beta||45)-45))*.008}});
function rs(){const w=isPortrait()?innerHeight:innerWidth,h=isPortrait()?innerWidth:innerHeight;R.setSize(w,h);CAM.aspect=w/h;CAM.updateProjectionMatrix()}rs();addEventListener('resize',rs);
const ck=new THREE.Clock();let lastDraw=0;
(function an(t){
  requestAnimationFrame(an);
  if(AR)return;
  const fpsCap=S.cfg.fps||60,minInt=1000/fpsCap;
  if(t-lastDraw<minInt-1)return;
  lastDraw=t;fCnt++;if(t-fT>=1000){liveFps=fCnt;fCnt=0;fT=t}
  const sec=t*.001,dt=ck.getDelta();
  LOBBY_AVS.forEach(a=>{if(a.grp.visible&&a.mix)a.mix.update(dt)});
  if(BGM)BGM.rotation.y=sec*.012;
  CAM.position.x=(S.cfg.rot?Math.sin(sec*.2)*.35:0)+gx;CAM.position.y=1.65-gy;CAM.lookAt(0,1.3,0);
  SOL.position.y=Math.sin(sec*1.6)*.03;SOL.position.x+=(tx-SOL.position.x)*.08;drag*=.985;
  SOL.rotation.y=(S.cfg.rot?Math.sin(sec*.4)*.08:0)+drag;
  rocks.forEach((k,i)=>{k.rotation.x=sec*.1*(i%3+1);k.rotation.y=sec*.08;k.position.y+=Math.sin(sec+i)*.0015});
  PS.rotation.y=sec*.02;R.render(SC,CAM);
})(0)}catch(e){console.warn('3D unavailable',e)}}

const BGS=['assets/bg.jpg','https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/2294472375_24a3b8ef46_o.jpg'];

async function grab(urls){for(const u of urls){try{let r=window.caches?await caches.match(u):null;if(!r){r=await fetch(u);if(!r.ok)continue;if(window.caches)try{(await caches.open('lul1')).put(u,r.clone())}catch(e){}}const b=await r.blob();return{u:URL.createObjectURL(b),mb:b.size/1048576}}catch(e){}}return null}
