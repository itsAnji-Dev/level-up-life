<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b132b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Level Up Life Ops — 3D Tactical Arena</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./style.css" />

  <!-- Three.js r128 + GLTFLoader + SkeletonUtils -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>

  <!-- Firebase Compat SDK (Auth + Realtime Database for Cloud Save & 5-Player Squad) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    // Paste your Firebase Web App credentials from Firebase Console -> Project Settings
    window.FIREBASE_CONFIG = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "level-up-life-ops.firebaseapp.com",
      databaseURL: "https://level-up-life-ops-default-rtdb.firebaseio.com",
      projectId: "level-up-life-ops",
      storageBucket: "level-up-life-ops.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
  </script>
</head>
<body>
  <!-- 3D Lobby Operator Showcase Canvas -->
  <canvas id="gl"></canvas>

  <!-- Main Lobby Shell -->
  <div id="ui">
    <header class="topbar">
      <div class="brand">
        <span class="b-tag">TACTICAL OPS</span>
        <h1>LEVEL UP LIFE</h1>
      </div>

      <div class="stats-strip">
        <div class="pill lvl">
          <b id="ui-lvl">LVL 1</b>
          <div class="xp-track"><i id="ui-xp-bar" style="width:0%"></i></div>
          <small id="ui-xp-txt">0 / 100 XP</small>
        </div>
        <div class="pill">🪙 <b id="ui-coins">250</b></div>
        <div class="pill">💎 <b id="ui-cp">25</b></div>
        <div class="pill">🏆 <b id="ui-wins">0</b></div>
      </div>

      <div class="auth-box" id="ui-auth">
        <button class="sm alt" id="btn-auth" onclick="AUTH.toggleSignIn()">🔑 SIGN IN</button>
      </div>
    </header>

    <main class="lobby-grid">
      <!-- Left Navigation & Active Panel -->
      <section class="panel main-panel">
        <nav class="tabs" id="ui-tabs">
          <button class="tab on" data-tab="ops" onclick="setTab('ops')">📋 OPS MISSIONS</button>
          <button class="tab" data-tab="armory" onclick="setTab('armory')">🔫 ARMORY & CRATES</button>
          <button class="tab" data-tab="squad" onclick="setTab('squad')">👥 5P SQUAD</button>
          <button class="tab" data-tab="settings" onclick="setTab('settings')">⚙️ SETTINGS</button>
        </nav>

        <div class="tab-body" id="tab-content"></div>
      </section>

      <!-- Right Operator Preview & Quick Deploy -->
      <aside class="panel deploy-panel">
        <div class="op-card">
          <div class="op-badge" id="ui-eq-rarity">RARE LOADOUT</div>
          <div class="op-name" id="ui-eq-gun">M4A1 TACTICAL</div>
          <div class="op-skin" id="ui-eq-skin">ARMOR: STANDARD ISSUE</div>
        </div>

        <div class="map-picker">
          <label class="s" for="ui-map-sel">ACTIVE BATTLEGROUND</label>
          <select id="ui-map-sel" onchange="selectMap(this.value)">
            <option value="firing_range">🌲 FIRING RANGE (DAYLIGHT)</option>
            <option value="nuketown">🏜️ NUKETOWN DESERT (SUNSET)</option>
            <option value="shipment">🚢 SHIPMENT DOCKS (OVERCAST)</option>
          </select>
        </div>

        <div class="deploy-actions">
          <button class="deploy-btn" onclick="startMatch(SQUAD_ID)">🚀 DEPLOY TO 3D ARENA</button>
          <button class="sm alt" style="width:100%" onclick="openHudEditor()">🎛️ CUSTOMIZE BATTLE HUD</button>
        </div>
      </aside>
    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-box" class="toast-box"></div>

  <script src="./app.js"></script>
  <script src="./arena3d.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
